<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>OSP Watch</title>
<style>
/* Look: the shop traveler. Surface-plate gray, white sheets, layout-fluid blue ink, tag colors only for trouble. */
:root {
  --plate: #d5d9d8;
  --sheet: #fff;
  --ink: #14171a;
  --mute: #525b63;
  --faint: #7c858d;
  --line: #aeb5b9;
  --hair: #dfe3e4;
  --bg: #eceeed;
  --accent: #1f3f94;
  --accent-bg: #e3e9f7;
  --red: #b3261e;
  --red-bg: #fae4e1;
  --amber: #6b4700;
  --amber-bg: #ffe08a;
  --amber-line: #c99700;
  --blue: #1f3f94;
  --blue-bg: #e3e9f7;
  --green: #1e6b3f;
  --green-bg: #e2f1e8;
  --gray: #525b63;
  --gray-bg: #eceeed;
  --din: Bahnschrift, 'DIN Alternate', 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: Bahnschrift, 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Consolas, Menlo, monospace;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  background: var(--plate);
  color: var(--ink);
  font: 15.5px/1.45 var(--body);
  display: flex;
  flex-direction: column;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
a {
  color: var(--accent);
}
.banner {
  background: #14171a;
  color: #c9cfd3;
  font-size: 13px;
  padding: 5px 16px;
  display: flex;
  gap: 14px;
  align-items: center;
}
.banner b {
  font-weight: 600;
  color: #ffe08a;
  white-space: nowrap;
  font-family: var(--din);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 12.5px;
}
.banner .sp {
  flex: 1;
}
.banner button {
  background: transparent;
  border: 1px solid #59626a;
  border-radius: 2px;
  padding: 2px 10px;
  cursor: pointer;
  color: #e8ecee;
  white-space: nowrap;
  flex: none;
  font-size: 12.5px;
}
.banner button:hover {
  background: #2a3035;
}
/* title block, as on a drawing or a traveler header */
.tb {
  display: flex;
  background: var(--sheet);
  border-bottom: 2px solid var(--ink);
}
.tb > div {
  padding: 8px 14px 9px;
  border-right: 1px solid var(--line);
  min-width: 0;
  flex: 0 1 auto;
}
.tb > div:nth-child(2),
.tb > div:nth-child(3) {
  flex: none;
}
.tb .name {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 200px;
  flex: none;
  border-right: 2px solid var(--ink);
}
.tb .name b {
  font: 700 19px/1 var(--din);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.logo {
  width: 26px;
  height: 26px;
  border-radius: 2px;
  background: var(--accent);
  display: grid;
  place-items: center;
  flex: none;
}
.tb label {
  display: block;
  white-space: nowrap;
  font: 600 10.5px/1.2 var(--din);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--mute);
}
.tb span {
  display: block;
  font: 600 14.5px/1.3 var(--mono);
  max-width: 210px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tb .grow {
  flex: 1;
  border-right: 0;
}
.tb .hot span {
  color: var(--red);
}
#tb_filec.hot {
  cursor: pointer;
}
.tb .hot.zero span {
  color: var(--ink);
}
.app {
  flex: 1;
  display: flex;
  min-height: 0;
}
nav {
  width: 200px;
  flex: none;
  border-right: 2px solid var(--ink);
  display: flex;
  flex-direction: column;
  padding: 10px 0;
  background: var(--plate);
}
nav button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  border-left: 5px solid transparent;
  background: none;
  padding: 9px 14px 9px 13px;
  cursor: pointer;
  text-align: left;
  color: var(--ink);
  font: 600 14px var(--din);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}
nav button:hover {
  background: #c8cdcc;
}
nav button[aria-current='page'] {
  background: var(--sheet);
  border-left-color: var(--accent);
  color: var(--accent);
}
nav button svg {
  flex: none;
  opacity: 0.75;
}
nav .badge {
  margin-left: auto;
  background: var(--red);
  color: #fff;
  font: 700 12px/20px var(--mono);
  border-radius: 2px;
  padding: 0 6px;
}
nav .badge.n {
  background: transparent;
  color: var(--mute);
  border: 1px solid var(--line);
  line-height: 18px;
}
nav .foot {
  margin-top: auto;
  font-size: 12px;
  color: var(--mute);
  padding: 10px 14px 0;
  border-top: 1px solid var(--line);
}
nav .foot kbd {
  font: 600 11px var(--mono);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 0 4px;
  background: var(--sheet);
}
main {
  flex: 1;
  overflow: auto;
  padding: 20px 26px 40px;
  background: var(--bg);
}
.head {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 14px;
}
.head h1 {
  font: 700 26px/1.1 var(--din);
  margin: 0;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.head p {
  margin: 3px 0 0;
  color: var(--mute);
}
.head .sp {
  flex: 1;
}
/* tally strip: joined cells, numbers lit only when there is trouble */
.tiles {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  margin-bottom: 14px;
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 3px;
  overflow: hidden;
}
.tile {
  background: none;
  border: 0;
  border-right: 1px solid var(--line);
  border-top: 4px solid transparent;
  border-radius: 0;
  padding: 8px 14px 10px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column-reverse;
}
.tile:last-child {
  border-right: 0;
}
.tile:hover {
  background: #f6f7f7;
}
.tile.on {
  background: var(--accent-bg);
  border-top-color: var(--accent);
}
.tile .n {
  font: 700 30px/1.1 var(--mono);
}
.tile .l {
  font: 600 11.5px/1.25 var(--din);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mute);
  min-height: 29px;
}
.tile.static {
  cursor: default;
}
.tile.static:hover {
  background: none;
}
.tile .s {
  font-size: 12.5px;
  color: var(--faint);
  margin-top: 2px;
  order: -1;
}
.tile.zero .n {
  color: var(--faint);
}
.tile[data-tf='x']:not(.zero) .n,
.tile[data-tf='late']:not(.zero) .n {
  color: var(--red);
}
.tile[data-tf='dnc']:not(.zero) .n,
.tile[data-tf='due2']:not(.zero) .n {
  color: #8a5a00;
}
.tile[data-tf='mid']:not(.zero) .n {
  color: var(--accent);
}
.card {
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 3px;
  margin-bottom: 14px;
  overflow-x: auto;
}
.card h2 {
  font: 700 14px var(--din);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin: 0;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: baseline;
  background: #f6f7f7;
}
.card h2 span {
  font: 400 13px var(--body);
  letter-spacing: 0;
  text-transform: none;
  color: var(--mute);
}
.card .pad {
  padding: 14px 16px;
}
table {
  border-collapse: collapse;
  width: 100%;
}
th {
  font: 600 11px var(--din);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--mute);
  text-align: left;
  padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: #f6f7f7;
}
td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--hair);
  vertical-align: middle;
  white-space: nowrap;
}
td .why {
  white-space: normal;
  max-width: 400px;
}
tr:last-child td {
  border-bottom: 0;
}
tr.click {
  cursor: pointer;
}
tr.click:hover td {
  background: #f4f6fb;
}
tr.kb td {
  background: var(--accent-bg);
}
tr[class*='tag-'] td:first-child {
  border-left: 5px solid transparent;
}
tr.tag-red td:first-child {
  border-left-color: var(--red);
}
tr.tag-amber td:first-child,
tr.tag-violet td:first-child {
  border-left-color: #e0a800;
}
tr.tag-blue td:first-child {
  border-left-color: var(--accent);
}
tr.tag-green td:first-child,
tr.tag-gray td:first-child {
  border-left-color: var(--hair);
}
.n {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
td.n,
th.n,
.kv .n {
  font-family: var(--mono);
  font-size: 14.5px;
}
.job {
  font: 700 16.5px var(--mono);
  letter-spacing: -0.01em;
}
.sub {
  display: block;
  font-size: 13px;
  color: var(--mute);
}
/* status as a rubber stamp */
.chip {
  display: inline-block;
  font: 700 11.5px/1.5 var(--din);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  border: 1.5px solid currentColor;
  border-radius: 2px;
  padding: 0 7px;
  white-space: nowrap;
}
.t-red {
  background: var(--red-bg);
  color: var(--red);
}
.t-amber {
  background: var(--amber-bg);
  color: var(--amber);
  border-color: var(--amber-line);
}
.t-violet {
  color: #7a4f00;
  border-style: dashed;
  background: #fff8e1;
}
.t-blue {
  color: var(--accent);
  background: var(--accent-bg);
}
.t-green {
  color: var(--green);
  background: none;
}
.t-gray {
  color: var(--mute);
  border-color: var(--line);
  background: none;
}
/* route strip: steps the processor reported, and where today falls in the turn */
.rt {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 500 13.5px var(--mono);
}
.rt .d {
  width: 48px;
}
.rt .d:last-child {
  text-align: right;
}
.strip {
  position: relative;
  display: flex;
  gap: 2px;
  width: 106px;
  flex: none;
  padding: 5px 0;
}
.strip i {
  flex: 1;
  height: 9px;
  border: 1px solid var(--line);
  background: #fff;
}
.strip i.f {
  background: var(--accent);
  border-color: var(--accent);
}
.strip b {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: -1px;
  background: var(--ink);
}
.strip b:before {
  content: '';
  position: absolute;
  top: -2px;
  left: -3px;
  border: 4px solid transparent;
  border-top-color: var(--ink);
}
.strip.behind b {
  background: var(--red);
}
.strip.behind b:before {
  border-top-color: var(--red);
}
.strip.done i {
  background: var(--green);
  border-color: var(--green);
}
.btn {
  border: 1px solid var(--line);
  background: var(--sheet);
  border-radius: 2px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
  font: 600 13px var(--din);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover {
  border-color: var(--ink);
}
.btn.pri {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn.pri:hover {
  background: #17307a;
  border-color: #17307a;
}
.btn.sm {
  padding: 4px 9px;
  font-size: 12px;
}
.muted {
  color: var(--mute);
}
.small {
  font-size: 13px;
  color: var(--mute);
}
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
select,
input[type='text'],
input[type='date'],
textarea {
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 6px 9px;
  background: #fff;
}
select:focus,
input:focus,
textarea:focus {
  border-color: var(--accent);
}
textarea {
  width: 100%;
  resize: vertical;
  font-family: var(--body);
}
.empty {
  padding: 28px;
  text-align: center;
  color: var(--mute);
}
.asked {
  font: 600 12px var(--mono);
  color: var(--accent);
  margin-left: 6px;
}
/* side panel: the job's traveler */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(20, 23, 26, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s;
}
.scrim.on {
  opacity: 1;
  pointer-events: auto;
}
.panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: 520px;
  max-width: 100%;
  background: var(--sheet);
  border-left: 2px solid var(--ink);
  transform: translateX(105%);
  transition: transform 0.14s;
  display: flex;
  flex-direction: column;
}
.panel.on {
  transform: none;
}
.panel header {
  padding: 14px 20px;
  border-bottom: 2px solid var(--ink);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.panel header h3 {
  margin: 0;
  font: 700 21px/1.15 var(--din);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.panel header .x {
  margin-left: auto;
  border: 0;
  background: none;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  color: var(--mute);
}
.panel .body {
  padding: 16px 20px;
  overflow: auto;
  flex: 1;
}
.panel .body > b {
  font: 700 12px var(--din);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mute);
}
.panel .foot {
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  background: #f6f7f7;
}
.field {
  margin-bottom: 10px;
}
.field label {
  display: block;
  font: 600 11px var(--din);
  color: var(--mute);
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.field input {
  width: 100%;
}
#dbody {
  font: 14px/1.5 var(--mono);
}
.note {
  font-size: 13px;
  color: var(--mute);
  background: var(--bg);
  border-left: 3px solid var(--line);
  padding: 8px 10px;
  margin-top: 10px;
}
.pick {
  border: 1.5px solid var(--accent);
  border-radius: 3px;
  padding: 12px;
  margin-top: 12px;
  background: var(--accent-bg);
}
.pick .row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
  align-items: center;
}
/* routing: operations numbered by tens, as on a router */
.tl {
  list-style: none;
  margin: 6px 0 14px;
  padding: 0;
  counter-reset: op;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.tl li {
  counter-increment: op 10;
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 0 12px;
  align-items: center;
  padding: 6px 12px 6px 0;
  border-bottom: 1px solid var(--hair);
}
.tl li:last-child {
  border-bottom: 0;
}
.tl li:before {
  content: counter(op);
  font: 600 12.5px var(--mono);
  color: var(--faint);
  text-align: center;
  border-right: 1px solid var(--hair);
  align-self: stretch;
  display: grid;
  place-items: center;
}
.tl li .w {
  color: var(--mute);
  font: 500 13px var(--mono);
}
.tl li.todo {
  color: var(--faint);
}
.tl li.done:before {
  color: #fff;
  background: var(--accent);
}
.tl li.now:before {
  color: #fff;
  background: var(--ink);
}
.tl li.now {
  font-weight: 700;
}
.tl.log li:before {
  content: '•';
  background: none;
  color: var(--accent);
}
.tl.setup {
  margin: 0;
  border: 0;
}
.tl.setup li {
  padding: 9px 14px 9px 0;
}
.tl.setup li.todo {
  color: var(--ink);
}
.tl.setup li:before {
  content: counter(op);
  counter-increment: none;
}
.tl.setup {
  counter-reset: op 0;
}
.tl.setup li {
  counter-increment: op 1;
}
.tl.setup li.done:before {
  content: '✓';
  background: var(--green);
}
.kv {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 4px 10px;
  font-size: 14.5px;
  margin-bottom: 14px;
}
.kv div:nth-child(odd) {
  color: var(--mute);
}
.box {
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 10px 12px;
  margin-top: 12px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  padding: 9px 16px;
  border-radius: 2px;
  font-size: 14.5px;
  opacity: 0;
  transition: all 0.15s;
  pointer-events: none;
  border-left: 5px solid #ffe08a;
}
.toast.on {
  opacity: 1;
  transform: translateX(-50%);
  pointer-events: auto;
}
.toast button {
  margin-left: 14px;
  background: none;
  border: 1px solid #7c858d;
  border-radius: 2px;
  color: #ffe08a;
  font: 600 12px var(--din);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 9px;
  cursor: pointer;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.steps {
  display: flex;
  gap: 0;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  border-radius: 2px;
  width: max-content;
  background: var(--sheet);
}
.steps span {
  font: 600 12px var(--din);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 5px 14px;
  color: var(--mute);
  border-right: 1px solid var(--line);
}
.steps span:last-child {
  border-right: 0;
}
.steps span.on {
  background: var(--accent);
  color: #fff;
}
.spark {
  display: block;
}
.bar {
  display: inline-block;
  vertical-align: middle;
  width: 120px;
  height: 9px;
  border: 1px solid var(--line);
  background: #fff;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--red);
}
.grp td {
  background: #f6f7f7;
  font: 700 14px var(--din);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
  border-top: 1px solid var(--line);
}
.grp td .small {
  font-family: var(--body);
  letter-spacing: 0;
  text-transform: none;
}
.ok {
  color: var(--green);
  font-weight: 600;
}
.bad {
  color: var(--red);
  font-weight: 600;
}
.legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 13px;
  color: var(--mute);
  margin: 0 0 6px;
}
.legend .strip {
  width: 60px;
}
body.drag:after {
  content: 'Drop the file to import it';
  position: fixed;
  inset: 14px;
  border: 3px dashed var(--accent);
  background: rgba(227, 233, 247, 0.92);
  display: grid;
  place-items: center;
  font: 700 26px var(--din);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  z-index: 50;
  pointer-events: none;
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}
@media (max-width: 900px) {
  nav {
    width: 58px;
  }
  nav .lbl,
  nav .foot {

}

          const v = $('#nd').value;
          if (m !== 'shipped' && v && v > T && v !== before.due) addEv(id, { m: 'newdate', to: v });
        }

document.addEventListener('click', (e) => {

  const dv = e.target.closest('[data-deliv]');
  if (dv) {
    markDelivered(dv.dataset.deliv);
    return;
  }
  if (e.target.closest('[data-addjob]')) {
    openAdd();
    return;
  }
  const b = e.target.closest('[data-draft]');
  if (b) {
    e.stopPropagation();
    openDraft(b.dataset.draft);
  }
  const c = e.target.closest('[data-credit]');

});
function markDelivered(id) {

/* ---------- job detail ---------- */
function openJob(id) {
  const j = job(id),
    s = statusOf(j, T),
    steps = ['sent', 'delivered', 'received', 'racked', 'in_process', 'processed', 'inspected', 'shipped', 'back'];
  const got = (m) => (m === 'received' ? j.ev.find((e) => e.m === 'received') : last(j, [m]));
  let lastDone = -1;
  steps.forEach((m, i) => {
    if (got(m)) lastDone = i;
  });
  const tl = steps
    .map((m, i) => {
      const e = got(m);
      const cls = e ? (i === lastDone ? 'now' : 'done') : 'todo';
      const extra = e
        ? m === 'delivered'
          ? ' · ' + esc(j.carrier) + (e.t ? ', ' + hm(e.t) : '')
          : m === 'shipped' && e.trk
            ? ' · ' + esc(e.trk)
            : m === 'sent' && j.trk
              ? ' · ' +
                esc(j.carrier) +
                ' ' +
                (trackUrl(j)
                  ? '<a target="_blank" rel="noopener" href="' + trackUrl(j) + '">' + esc(j.trk) + '</a>'
                  : esc(j.trk))
              : m === 'sent'
                ? ' · ' + esc(j.carrier)
                : ''
        : i < lastDone
          ? ' · not reported'
          : '';
      return (
        '<li class="' + cls + '"><div>' + MS[m] + '</div><div class="w">' + (e ? fmtW(e.d) : '') + extra + '</div></li>'
      );
    })
    .join('');
  const notes = j.ev
    .filter((e) => e.m === 'ask' || e.m === 'newdate')
    .map(
      (e) =>
        '<li><div>' +
        (e.m === 'ask' ? 'We asked: ' + esc(e.what || 'check') : 'New date given: ' + fmtW(e.to)) +
        '</div><div class="w">' +
        fmtW(e.d) +
        (e.t ? ', ' + hm(e.t) : '') +
        '</div></li>',
    )
    .join('');
  const L = j.exp ? ledger([j], T)[0] : null;
  const mine = st.added.some((a) => a.id === id);
  openPanel(
    '<header><div><h3>Job ' +
      jn(j) +
      ' · ' +
      esc(j.process) +
      '</h3><div class="small">' +
      esc(j.proc) +
      (j.qty ? ' · ' + j.qty + ' pcs' : '') +
      (j.po ? ' · ' + esc(j.po) : '') +
      '</div><div style="margin-top:6px">' +
      chip(s.k) +
      '</div></div><button class="x" type="button" data-close aria-label="Close">×</button></header><div class="body">' +
      '<div class="kv"><div>Sent</div><div>' +
      fmtW(j.sent) +
      '</div><div>Quoted turn</div><div>' +
      j.q +
      ' days</div><div>Due back</div><div>' +
      fmtW(j.due) +
      (s.due !== j.due ? ' → <b>' + fmtW(s.due) + '</b> (new date)' : '') +
      '</div>' +
      (s.k !== 'back' && s.k !== 'shipped' && isOpen(j)
        ? '<div>Midpoint check</div><div>' + fmtW(midDate(j)) + '</div>'
        : '') +
      '</div>' +
      '<b>Routing</b><ul class="tl">' +
      tl +
      '</ul>' +
      (notes ? '<b>Activity</b><ul class="tl log">' + notes + '</ul>' : '') +
      (L
        ? '<div class="box"><b>Expedite</b><div class="kv" style="margin:6px 0 0"><div>Fee</div><div>' +
          money(L.fee) +
          ', paid ' +
          fmtW(L.bought) +
          '</div><div>Bought the date</div><div>' +
          fmtW(L.by) +
          '</div><div>Result</div><div>' +
          resChip(L) +
          '</div></div></div>'
        : '') +
      (isOpen(j) && !j.exp
        ? '<div class="box" id="xbox"><b>Paid an expedite on this job?</b><div class="pick" style="border:0;padding:0;margin:0;background:none"><div class="row"><input type="text" id="xfee" placeholder="Fee, $" style="width:90px"><span class="small">to be back by</span><input type="date" id="xby"><button type="button" class="btn sm" id="xadd">Add expedite</button></div></div></div>'
        : '') +
      (mine
        ? '<p class="small" style="margin-top:14px"><a href="#" id="jed">Edit this job</a> (fix a date, quantity or processor) · <a href="#" id="jrm">Remove it</a></p>'
        : '') +
      '</div><div class="foot">' +
      (s.action ? '<button type="button" class="btn pri" data-draft="' + esc(j.id) + '">Draft email</button>' : '') +
      (isOpen(j) && !last(j, ['delivered']) && !j.ev.some((e) => PROC_M.includes(e.m))
        ? '<button type="button" class="btn" id="jdel">Mark delivered</button>'
        : '') +
      (isOpen(j) && s.k !== 'shipped'
        ? '<button type="button" class="btn" id="jupd">Log processor update</button>'
        : '') +
      (isOpen(j) ? '<button type="button" class="btn" id="jback">Mark received back</button>' : '') +
      (L && L.res === 'missed'
        ? '<button type="button" class="btn" data-credit="' + esc(j.id) + '">Credit request</button>'
        : '') +
      '<span style="flex:1"></span><button type="button" class="btn" data-close>Close</button></div>',
  );
  const del = $('#jdel');
  if (del) del.onclick = () => markDelivered(id);
  const ju = $('#jupd');
  if (ju)
    ju.onclick = () => {
      openDraft(id);
      $('#pick').hidden = false;
    };
  const jb = $('#jback');
  if (jb)
    jb.onclick = () => {
      const was = statusOf(job(id), T);
      snap();
      addEv(id, { m: 'back' });
      if (was.action) st.handled[id] = 'Received back (was: ' + ST[was.k][0].toLowerCase() + ')';
      save();
      closePanel();
      render();
      toast('Job ' + (j.jn || id) + ' received back. Its turn time joins the processor history.', true);
    };
  const xa = $('#xadd');
  if (xa)
    xa.onclick = () => {
      const fee = parseFloat(($('#xfee').value || '').replace(/[$,]/g, '')),
        by = $('#xby').value;
      if (!(fee > 0) || !by) {
        toast('Enter the fee and the date it was to be back by.');
        return;
      }
      snap();
      st.exp[id] = { fee, bought: T, by };
      save();
      closePanel();
      render();
      toast('Expedite logged: ' + money(fee) + ' for ' + fmt(by) + '.', true);
    };
  const je = $('#jed');
  if (je)
    je.onclick = (e) => {
      e.preventDefault();
      openAdd(st.added.find((a) => a.id === id));
    };
  const rm = $('#jrm');
  if (rm)
    rm.onclick = (e) => {
      e.preventDefault();
      snap();
      st.removed.push(id);
      st.added = st.added.filter((a) => a.id !== id);
      delete st.ev[id];
      delete st.exp[id];
      delete st.handled[id];
      save();
      closePanel();
      render();
      toast('Job ' + (j.jn || id) + ' removed.', true);
    };
}

/* ---------- add a job ---------- */
function makeJob(o) {
  const have = new Set(jobs().map((j) => j.id));
  let id = o.job,
    n = 2;
  while (have.has(id)) id = o.job + ' #' + n++;
  const carrier = o.carrier || 'Shop driver',
    ev = [{ m: 'sent', d: o.sent }];
  if (OWN.test(carrier) && o.sent <= T) ev.push({ m: 'delivered', d: o.sent });
  if (o.back) ev.push({ m: 'back', d: o.back });
  const j = {
    id,
    po: o.po || '',
    proc: o.proc,
    process: o.process || 'Outside process',
    q: Math.max(1, D(o.due) - D(o.sent)),
    qty: o.qty || 0,
    sent: o.sent,
    due: o.due,
    carrier,
    trk: o.trk || '',
    ev,
    open: !o.back,
    exp: o.fee > 0 && o.by ? { fee: o.fee, bought: o.sent, by: o.by } : null,
  };
  if (id !== o.job) j.jn = o.job;
  return j;
}

      });
      if (OWN.test(o.carrier) && o.sent <= T && !a.ev.some((e) => e.m === 'delivered'))
        a.ev.push({ m: 'delivered', d: o.sent });
      if (!st.exp[ed.id])
        a.exp = o.fee > 0 && o.by ? { fee: o.fee, bought: (a.exp && a.exp.bought) || o.sent, by: o.by } : null;
      save();
      closePanel();
      render();
      toast('Job ' + (ed.jn || ed.id) + ' updated.', true);
      return;
    }
    st.added.push(makeJob(o));
    save();
    closePanel();
    st.view = 'jobs';
    render();
    toast('Job ' + o.job + ' added.');
  };
}

    .sort((a, b) =>

        ? a[0].sent < b[0].sent

    '<div class="tile static"><div class="n" style="color:var(--green)">' +

    ' jobs</div></div>' +
    '<div class="tile static"><div class="n" style="color:var(--red)">' +

function spark(p) {

    t = p.turns,

    x = (i) => 4 + (i * (w - 8)) / Math.max(1, t.length - 1),
    y = (v) => h - 3 - ((v - lo) * (h - 6)) / (hi - lo);

    h +
    '" viewBox="0 0 ' +
    w +

    h +

    (w - 2) +
    '" y1="' +
    y(p.q) +

    x(t.length - 1) +

}

async function inflate(u8) {
  const ds = new DecompressionStream('deflate-raw'),
    w = ds.writable.getWriter();
  w.write(u8);
  w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf) {
  const dv = new DataView(buf),
    u8 = new Uint8Array(buf),
    out = {},
    td = new TextDecoder();
  let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('not a zip');
  let p = dv.getUint32(e + 16, true);
  const n = dv.getUint16(e + 10, true);
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true),
      csize = dv.getUint32(p + 20, true),
      nl = dv.getUint16(p + 28, true),
      xl = dv.getUint16(p + 30, true),
      cl = dv.getUint16(p + 32, true),
      lo = dv.getUint32(p + 42, true),
      name = td.decode(u8.subarray(p + 46, p + 46 + nl));
    out[name] = { method, csize, lo };
    p += 46 + nl + xl + cl;
  }
  return {
    names: Object.keys(out),
    read: async (name) => {
      const f = out[name];
      if (!f) return null;
      const nl = dv.getUint16(f.lo + 26, true),
        xl = dv.getUint16(f.lo + 28, true),
        d = u8.subarray(f.lo + 30 + nl + xl, f.lo + 30 + nl + xl + f.csize);
      return td.decode(f.method === 0 ? d : await inflate(d));
    },
  };
}
const xmlText = (s) =>

    .replace(/&quot;/g, '"')

  const z = await unzip(buf),
    sst = [],
    ss = await z.read('xl/sharedStrings.xml');

      sst.push(xmlText([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((x) => x[1]).join('')));
  const dateStyle = [],
    st = await z.read('xl/styles.xml');
  if (st) {
    const custom = {};
    for (const m of st.matchAll(/<numFmt [^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g)) custom[m[1]] = m[2];
    const xfs = (st.match(/<cellXfs[\s\S]*?<\/cellXfs>/) || [''])[0];
    for (const m of xfs.matchAll(/<xf [^>]*numFmtId="(\d+)"/g)) {
      const id = +m[1],
        fc = custom[id] || '';
      dateStyle.push(
        (id >= 14 && id <= 22) || (id >= 45 && id <= 47) || /[dy]/i.test(fc.replace(/"[^"]*"|\[[^\]]*\]/g, '')),

      .filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))

    xml = await z.read(sheet),

function parseCSV(t) {
  const rows = [];
  let r = [],
    f = '',
    q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') {
        if (t[i + 1] === '"') {
          f += '"';
          i++;
        } else q = false;
      } else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') {
      r.push(f);
      f = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && t[i + 1] === '\n') i++;
      r.push(f);
      f = '';
      if (r.some((x) => x.trim())) rows.push(r);
      r = [];
    } else f += c;
  }
  r.push(f);
  if (r.some((x) => x.trim())) rows.push(r);
  return rows;
}

        .filter(Boolean)

  }
});

const FS = typeof window.showSaveFilePicker === 'function';
function hdb(mode, fn) {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('osp-watch', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onerror = () => rej(r.error);
      r.onsuccess = () => {
        const tx = r.result.transaction('kv', mode),
          q = fn(tx.objectStore('kv'));
        tx.oncomplete = () => res(q && q.result);
        tx.onerror = () => rej(tx.error);
      };
    } catch (e) {
      rej(e);
    }
  });
}
const shareable = (s) => {
  const o = Object.assign({}, s);
  delete o.view;
  delete o.handled;
  delete o.hday;
  return o;
};
async function fileSync() {
  if (!fh || fileBusy || MODE !== 'live') return;
  fileBusy = true;
  let changed = false;
  try {
    if (fh.queryPermission && (await fh.queryPermission({ mode: 'readwrite' })) !== 'granted') {
      fileOK = false;
      fileNote = 'Click "Reconnect" to keep saving to the shared file.';
      return;
    }
    const f = await fh.getFile(),
      txt = await f.text();
    let o = null;
    if (txt.trim()) {
      try {
        o = JSON.parse(txt);
      } catch (e) {
        throw new Error('The shared file could not be read. Restore it from a backup.');
      }
      if (!o || !o.state || !Array.isArray(o.state.added)) throw new Error('That file is not an OSP Watch file.');
    }
    if (o && o.rev !== fileRev) {
      const mine = JSON.stringify(shareable(st));
      st = Object.assign(blank(), mergeState(shareable(st), o.state), {
        view: st.view,
        handled: st.handled,
        hday: st.hday,
      });
      changed = true;
      if (JSON.stringify(shareable(st)) !== JSON.stringify(o.state)) dirty = true;
      try {
        localStorage.setItem(KEYS.live, JSON.stringify(st));
      } catch (e) {}
    }
    if (dirty || !o) {
      const rev = Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        w = await fh.createWritable();
      await w.write(
        JSON.stringify({
          app: 'osp-watch',
          v: 1,
          rev,
          saved: localToday() + ' ' + now(),
          by: st.signer || '',
          state: shareable(st),
        }),
      );
      await w.close();
      fileRev = rev;
      dirty = false;
    } else fileRev = o.rev;
    fileOK = true;
    fileNote = 'Saved to ' + fh.name + ' at ' + hm(now()) + '.';
  } catch (e) {
    fileOK = false;
    fileNote = String((e && e.message) || e);
  } finally {
    fileBusy = false;
    if (changed || st.view === 'set') render();
    else tbFile();
  }
}

      rows.join('') +
      '</tbody></table></div>';
  return (
    '<div class="head"><div><h1>For your IT</h1><p>What this page stores, where, and what leaves the computer. Written so each line can be checked, not taken on trust.</p></div><span class="sp"></span><button type="button" class="btn" onclick="window.print()">Print</button></div>' +
    '<div class="card"><div class="pad"><p style="margin:0"><b>Read this first.</b> OSP Watch is an early version built by a four-student senior project team at Cal Poly. Nobody has audited it and it holds no certification of any kind. This sheet describes what the page does so you can decide where, or whether, it belongs in your own inventory. Version of this page: <b>2026-11-18</b>.</p></div></div>' +
    card('What it is', '', [
      row(
        'One file',

      row(

      ),
      row(

        "The page carries a Content-Security-Policy that tells the browser to refuse every connection (<code>default-src 'none'; connect-src 'none'</code>). To check: open developer tools, Network tab, use the page; no requests appear after the page itself loads.",
      ),
      row(

      ),
    ]) +
    card('What it stores', 'only what a user types or imports', [
      row(
        'Per job',
        'Job number, PO number, processor name, process name, quantity, date sent, date due, carrier, tracking number, expedite fee and date, and the dated steps a user logs (delivered, received, shipped, new date).',
      ),
      row(
        'Per shop',
        'Shop name, the name that signs emails, one contact email per processor, and three numbers for a time estimate.',
      ),
      row(
        'Not stored',
        'A pasted processor reply is read on screen to pick out a step and a date, then discarded. On import, columns that are not matched are never read into storage; the import screen lists them.',
      ),
      row(
        'What not to enter',
        'Part numbers, drawings, specifications, program names and customer names. The page does not need them. Its fields are free text, so it cannot stop someone typing them; that has to be a rule for the user.',
      ),
    ]) +
    card('Where it is stored', '', [
      row(
        'This browser',
        "The browser's local storage for this page (keys beginning <code>osp-watch-</code>), on this computer, in this browser profile. Plain text, not encrypted by the page. Protected by whatever protects the computer and the user's login.",
      ),
      row(
        'Shared file (optional)',
        "If the office turns on sharing in Setup, one JSON file in a folder you choose on your own drive. Chrome or Edge only. The browser asks the user for permission to that one file. Plain text; protected by your drive's own permissions.",
      ),
      row(
        'Backups and exports',
        'Files the user downloads on purpose: a JSON backup and a CSV of jobs. They go wherever the user saves them.',
      ),
      row('The team', 'The student team has no copy of any of it and no way to reach it.'),
    ]) +
    card('What leaves the computer', 'three things, each started by the user', [
      row(
        'Drafted emails',
        '"Open in Outlook" hands the draft to the computer\'s own mail program through a mailto link. The message is sent from the user\'s mailbox like any other. The page never connects to a mailbox.',
      ),
      row(
        'Carrier tracking',
        'The "Track" link opens the UPS or FedEx website in a new tab with that tracking number in the address.',
      ),
      row('Printing and downloads', 'The call sheet, the monthly summary, backups and exports.'),
    ]) +
    card('Common questions', '', [
      row('Does a vendor hold our data?', 'No. Nothing is sent to the team or to any service.'),
      row(
        'Does it sign in to Microsoft 365?',

}

/* ---------- tour: nine stops through the demo ---------- */
const TOURKEY = 'osp-watch-tour-v1';
let tourI = -1,
  tourPrev = null;
const TOUR = [
  {
    v: 'today',
    sel: '#view .tiles',
    t: 'Start here each morning',
    x: 'These are the open jobs that need a word with a processor today, counted by reason. Jobs that are on track stay off this list.',
  },
  {
    v: 'today',
    sel: '#view tr.click[data-job]',
    t: 'Each job says why it is here',
    x: 'Delivered but nobody confirmed receipt. Halfway through the turn. Due in two days with no ship notice. The strip shows the last step the processor reported.',
  },
  {
    v: 'today',
    sel: '#panel',
    pre: () => {
      const b = $('#view [data-draft]');
      if (b) openDraft(b.dataset.draft);
    },
    t: 'The email is already written',
    x: 'It asks for a physical step, such as "is it racked?", not "are we on track?". Edit it, then open it in your own mailbox. Nothing is sent from this page. When they answer, paste the reply here and the step is picked out for you.',
  },
  {
    v: 'jobs',
    sel: '#view table',
    t: 'Everything that is out',
    x: 'Every open job at every processor, with where it stands between sent and due. Filter by processor or status, or search a job number.',
  },
  {
    v: 'exp',
    sel: '#view .tiles',
    t: 'What the rush fees bought',
    x: 'Every expedite fee, the date it paid for, and whether that date was met. A missed one gets a drafted credit request.',
  },
  {
    v: 'procs',
    sel: '#view .card:not([hidden])',
    t: 'Real turn times for your next quote',
    x: 'What each processor quotes against what they actually took, built from jobs marked received back. The blue figure is the lead time to quote with.',
  },
  {
    v: 'imp',
    sel: '#view .card',
    t: 'Getting your jobs in',
    x: 'Paste rows from Excel, or drag in a spreadsheet or an ERP export. It needs four columns: job, processor, date sent, due back. Part numbers and customer names are not read or stored.',
  },
  {
    v: 'sum',
    sel: '#view .card',
    t: 'The month in your own numbers',
    x: 'What was caught early, what expedites cost, and what was missed. Print it for the monthly meeting.',
  },
  {
    v: 'today',
    sel: '#bswitch',
    t: 'Try it on your own jobs',
    x: "This switches to empty screens on today's date. Your jobs stay in this browser, or in one file on your shared drive if the office wants to share them. Come back to this demo any time.",
  },
];
function tourPlace() {
  const s = TOUR[tourI];
  if (!s) return;
  const el = document.querySelector(s.sel),
    hole = $('#tourhole'),
    pop = $('#tourpop'),
    vw = innerWidth,
    vh = innerHeight,
    ph = pop.offsetHeight,
    pw = pop.offsetWidth;
  if (!el) {
    hole.style.cssText = 'left:50%;top:50%;width:0;height:0;border:0';
    pop.style.left = (vw - pw) / 2 + 'px';
    pop.style.top = (vh - ph) / 2 + 'px';
    return;
  }
  const r = el.getBoundingClientRect(),
    p = 6,
    L = Math.max(4, r.left - p),
    Tp = Math.max(4, r.top - p),
    W = Math.min(vw - 4, r.right + p) - L,
    H = Math.min(vh - 4, r.bottom + p) - Tp;
  hole.style.cssText = 'left:' + L + 'px;top:' + Tp + 'px;width:' + W + 'px;height:' + H + 'px';
  let x, y;
  if (Tp + H + 12 + ph <= vh) {
    x = L;
    y = Tp + H + 12;
  } else if (Tp - 12 - ph >= 0) {
    x = L;
    y = Tp - 12 - ph;
  } else if (L - 12 - pw >= 0) {
    x = L - 12 - pw;
    y = Tp + 24;
  } else if (L + W + 12 + pw <= vw) {
    x = L + W + 12;
    y = Tp + 24;
  } else {
    x = vw - pw - 16;
    y = vh - ph - 16;
  }
  pop.style.left = Math.max(12, Math.min(x, vw - pw - 12)) + 'px';
  pop.style.top = Math.max(12, Math.min(y, vh - ph - 12)) + 'px';
}
function tourGo(i) {
  if (i < 0) return;
  if (i >= TOUR.length) {
    tourEnd();
    return;
  }
  if (tourI < 0) {
    tourPrev = { mode: MODE, view: st.view };
    if (MODE !== 'demo') setMode('demo');
    document.body.insertAdjacentHTML(
      'beforeend',
      '<div class="tourblock" id="tourblock"></div><div class="tourhole" id="tourhole"></div><div class="tourpop" id="tourpop" role="dialog" aria-modal="true" aria-label="Tour"></div>',
    );
  }
  tourI = i;
  const s = TOUR[i];
  closePanel();
  todayFilter = '';
  st.view = s.v;
  render();
  if (s.pre) s.pre();
  $('#tourpop').innerHTML =
    '<div class="tn">Stop ' +
    (i + 1) +
    ' of ' +
    TOUR.length +
    '</div><h3>' +
    s.t +
    '</h3><p>' +
    s.x +
    '</p><div class="ta"><button type="button" class="skip" data-tour="end">' +
    (i === TOUR.length - 1 ? 'Close' : 'Skip the tour') +
    '</button><span style="flex:1"></span>' +
    (i ? '<button type="button" class="btn sm" data-tour="back">Back</button>' : '') +
    '<button type="button" class="btn pri sm" data-tour="next">' +
    (i === TOUR.length - 1 ? 'Done' : 'Next') +
    '</button></div>';
  const el = document.querySelector(s.sel);
  {
    const V = $('#view');
    if (el && V.contains(el)) {
      const r = el.getBoundingClientRect(),
        vr = V.getBoundingClientRect();
      V.scrollTop += r.top - vr.top - (r.height > vr.height * 0.55 ? 8 : Math.max(8, (vr.height - r.height) / 2));
    }
  } /* vertical only: a wide table must not drag the page sideways */
  tourPlace();
  setTimeout(tourPlace, 180);
  const n = $('#tourpop [data-tour="next"]');
  if (n) n.focus();
}
function tourEnd() {
  if (tourI < 0) return;
  tourI = -1;
  ['tourblock', 'tourhole', 'tourpop'].forEach((id) => {
    const e = $('#' + id);
    if (e) e.remove();
  });
  try {
    localStorage.setItem(TOURKEY, '1');
  } catch (e) {}
  closePanel();
  if (tourPrev && tourPrev.mode !== MODE) setMode(tourPrev.mode);
  else {
    st.view = 'today';
    render();
  }
  tourPrev = null;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-tour]');
  if (b) {
    const a = b.dataset.tour;
    a === 'end' ? tourEnd() : tourGo(tourI + (a === 'back' ? -1 : 1));
  }
});
document.addEventListener(
  'keydown',
  (e) => {
    if (tourI < 0) return;
    e.stopImmediatePropagation();
    if (e.key === 'Escape') tourEnd();
    else if (e.key === 'ArrowRight') tourGo(tourI + 1);
    else if (e.key === 'ArrowLeft') tourGo(tourI - 1);
  },
  true,
);
addEventListener('resize', () => {
  if (tourI >= 0) tourPlace();
});
$('#btour').onclick = () => tourGo(0);
{
  let seen = true;
  try {
    seen = !!localStorage.getItem(TOURKEY);
  } catch (e) {}
  if (!seen && MODE === 'demo' && innerWidth >= 760 && !matchMedia('print').matches) setTimeout(() => tourGo(0), 400);
}
</script></body></html>
