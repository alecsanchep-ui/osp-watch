     Built from source by ospkit.py; edit the source, not this file. -->

<title>OSP Watch</title>
<style>/* Plain office software: flat, square, dense, with visible gridlines. Today reads as a mail list with a
   reading pane, Jobs as a spreadsheet, and the running totals sit in a status bar at the foot of the window.
   One blue accent; colour otherwise only where a job is in trouble. System fonts only. */

:root {
  --sheet: #fff;
  --chrome: #f3f3f3;
  --ink: #1f1f1f;
  --mute: #5c5c5c;
  --faint: #707070;
  --line: #c8c8c8;
  --grid: #e1e1e1;
  --hover: #f0f6fc;
  --selected: #cfe4fa;
  --accent: #0f6cbd;
  --accent-dark: #115ea3;
  --red: #c50f1f;
  --amber: #8a6100;
  --amber-bg: #fff4ce;
  --amber-line: #f2c661;
  --green: #107c10;
  --ui: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
}

/* ---------- base ---------- */

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  background: var(--sheet);
  color: var(--ink);
  font: 13px/1.4 var(--ui);
  font-variant-numeric: tabular-nums;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
a {
  color: var(--accent);
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
select,
input[type='text'],
input[type='search'],
input[type='date'],
textarea {
  padding: 4px 7px;
  /* A field's edge is darker than a gridline, so the field can be found. */
  border: 1px solid #8a8a8a;
  border-radius: 2px;
  background: var(--sheet);
}
select:focus,
input:focus,
textarea:focus {
  border-color: var(--accent);
}
textarea {
  width: 100%;
  resize: vertical;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th,
td {
  padding: 5px 9px;
  border: 1px solid var(--grid);
  text-align: left;
  white-space: nowrap;
}
th {
  position: sticky;
  top: 0;
  background: var(--chrome);
  font-weight: 600;
}
tr > :first-child {
  border-left: 0;
}
tr > :last-child {
  border-right: 0;
}
tbody tr:last-child td {
  border-bottom: 0;
}

/* ---------- small pieces ---------- */

.grow {
  flex: 1;
}
.row.first {
  margin-top: 0;
}
.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}
.n {
  text-align: right;
}
.small {
  color: var(--mute);
  font-size: 12px;
}
.muted {
  color: var(--mute);
}
.ok {
  color: var(--green);
  font-weight: 600;
}
.bad {
  color: var(--red);
  font-weight: 600;
}
.job {
  font-weight: 600;
}
.jobcol {
  width: 100px;
}
.sub {
  display: block;
  color: var(--mute);
  font-size: 12px;
  white-space: normal;
}
.short {
  width: 90px;
}
.wide {
  width: 320px;
}
.link {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
}
.btn {
  display: inline-flex;
  align-items: center;
  padding: 3px 11px;
  border: 1px solid #adadad;
  border-radius: 2px;
  background: var(--sheet);
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.btn:hover {
  border-color: var(--accent);
  background: var(--hover);
}
.btn.pri {
  border-color: var(--accent);
  background: var(--accent);
  color: #fff;
}
.btn.pri:hover {
  border-color: var(--accent-dark);
  background: var(--accent-dark);
}
.btn.sm {
  padding: 1px 8px;
  font-size: 12px;
}
/* A status is a small coloured square and its name, as a category is marked in a mail list. */
.chip {
  white-space: nowrap;
}
.chip::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  background: #a6a6a6;
}
.t-red {
  color: var(--red);
  font-weight: 600;
}
.t-red::before {
  background: var(--red);
}
.t-amber::before {
  background: var(--amber);
}
.t-blue::before {
  background: var(--accent);
}
.t-green::before {
  background: var(--green);
}
.t-gray {
  color: var(--mute);
}
.empty {
  padding: 24px;
  color: var(--mute);
  text-align: center;
}
.note {
  margin-top: 10px;
  padding: 6px 9px;
  border: 1px solid var(--grid);
  background: var(--chrome);
  color: var(--mute);
  font-size: 12px;
}
.note.inset {
  margin: 10px 14px 0;
}
.box {
  margin-top: 12px;
  padding: 8px 10px;
  border: 1px solid var(--line);
}
.kv {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 3px 10px;
  margin-bottom: 12px;
}
.kv > :nth-child(odd) {
  color: var(--mute);
}
.kv.ledger {
  grid-template-columns: 1fr auto;
  align-items: center;
}
.box .kv {
  margin: 6px 0 0;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* ---------- frame: banner, top bar, navigation, status bar ---------- */

.banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 3px 12px;
  border-bottom: 1px solid var(--amber-line);
  background: var(--amber-bg);
  font-size: 12px;
}
.banner b {
  font-weight: 600;
  white-space: nowrap;
}
.banner button {
  flex: none;
  padding: 1px 9px;
  border: 1px solid #adadad;
  border-radius: 2px;
  background: var(--sheet);
  white-space: nowrap;
  cursor: pointer;
}
.banner button:hover {
  border-color: var(--accent);
}
.tb {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 40px;
  padding: 0 14px;
  background: var(--accent);
  color: #fff;
}
.tb .name {
  width: 150px;
  font-size: 15px;
  font-weight: 600;
}
.tb input {
  width: 340px;
  max-width: 40%;
  border: 0;
}
.tb input:focus {
  outline: 2px solid #fff;
}
.app {
  display: flex;
  flex: 1;
  min-height: 0;
}
nav {
  flex: none;
  width: 180px;
  padding: 6px 0;
  border-right: 1px solid var(--line);
  background: var(--chrome);
}
nav button {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  padding: 5px 14px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}
nav button:hover {
  background: #e6e6e6;
}
nav button[aria-current='page'] {
  background: var(--selected);
  font-weight: 600;
}
nav .badge {
  color: var(--accent);
  font-weight: 600;
}
nav .badge.n {
  color: var(--mute);
  font-weight: 400;
}
nav button[aria-current='page'] .badge {
  color: var(--ink);
}
main {
  flex: 1;
  overflow: auto;
  padding: 12px 16px 24px;
}
.status {
  display: flex;
  gap: 20px;
  padding: 2px 12px;
  border-top: 1px solid var(--line);
  background: var(--chrome);
  color: var(--mute);
  font-size: 12px;
  white-space: nowrap;
}
.status b {
  color: var(--ink);
  font-weight: 600;
}
.status kbd {
  padding: 0 3px;
  border: 1px solid var(--line);
  background: var(--sheet);
  font: inherit;
}
/* The shared file has stopped saving: the cell turns amber and reconnects when clicked. */
.status .alarm {
  padding: 0 6px;
  background: var(--amber-bg);
  cursor: pointer;
}

/* ---------- a screen: heading, figures, sections ---------- */

.head {
  display: flex;
  align-items: flex-end;
  gap: 14px;
  margin-bottom: 10px;
}
.head h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}
.head p {
  margin: 1px 0 0;
  color: var(--mute);
}
.head .sp {
  flex: 1;
}
.lead {
  margin: -2px 0 10px;
}

/* Figures side by side in one ruled strip. */
.tiles {
  display: grid;
  grid-auto-columns: 1fr;
  grid-auto-flow: column;
  margin-bottom: 12px;
  border: 1px solid var(--line);
}
.tile {
  display: flex;
  flex-direction: column-reverse;
  padding: 6px 10px 7px;
  border: 0;
  border-right: 1px solid var(--grid);
  background: none;
  text-align: left;
}
.tile:last-child {
  border-right: 0;
}
.tile .n {
  font-size: 18px;
  font-weight: 600;
  text-align: left;
}
.tile .n.neg {
  color: var(--red);
}
.tile .l {
  color: var(--mute);
  font-size: 12px;
}
.tile .s {
  order: -1;
  color: var(--faint);
  font-size: 12px;
}

/* A section: a ruled box with a grey title bar. */
.card {
  margin-bottom: 12px;
  overflow-x: auto;
  border: 1px solid var(--line);
}
.card h2 {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 0;
  padding: 5px 9px;
  border-bottom: 1px solid var(--line);
  background: var(--chrome);
  font-size: 13px;
  font-weight: 600;
}
.card h2 span {
  color: var(--mute);
  font-weight: 400;
}
.card .pad {
  padding: 10px 12px;
}
.pad > p:first-child {
  margin-top: 0;
}
.pad > p:last-child {
  margin-bottom: 0;
}

/* ---------- lists of jobs ---------- */

tr.click {
  cursor: pointer;
}
tr.click:hover td {
  background: var(--hover);
}
tr.kb td,
tr.sel td,
tr.sel:hover td {
  background: var(--selected);
}
.asked {
  margin-left: 8px;
  color: var(--accent);
  font-size: 12px;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 6px 9px;
  border-bottom: 1px solid var(--line);
}
.filters input[type='search'] {
  width: 180px;
}

/* Today: tabs that filter by reason, then the list. */
.inbox .tiles {
  display: flex;
  flex-wrap: wrap;
  margin-bottom: 0;
  border: 0;
  border-bottom: 1px solid var(--line);
}
.inbox .tile {
  flex-direction: row-reverse;
  align-items: baseline;
  gap: 5px;
  margin-bottom: -1px;
  padding: 5px 9px;
  border: 0;
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.inbox .tile:hover {
  background: var(--hover);
}
.inbox .tile.on {
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.inbox .tile .n,
.inbox .tile .l {
  color: inherit;
  font-size: 13px;
  font-weight: inherit;
}
.inbox .tile.zero {
  color: var(--faint);
}
.tile[data-tf='x']:not(.zero) .n,
.tile[data-tf='late']:not(.zero) .n {
  color: var(--red);
  font-weight: 600;
}
.inbox .card {
  border-top: 0;
}
.inbox .card h2 {
  display: none;
}
.inbox .card + .card {
  margin-top: 12px;
  border-top: 1px solid var(--line);
}
.inbox .card + .card h2 {
  display: flex;
}
/* Fixed column widths, so the list always fits its pane and long text wraps inside its own column. */
.msgs {
  table-layout: fixed;
}
.msgs th:nth-child(1) {
  width: 22%;
}
.msgs th:nth-child(2) {
  width: 24%;
}
.msgs th:nth-child(4) {
  width: 78px;
}
.msgs td {
  vertical-align: top;
  white-space: normal;
}
.msgs .why {
  display: block;
  color: var(--mute);
}
.from {
  font-weight: 600;
}
/* Jobs: headings that sort. */
.grid th {
  padding: 0;
}
.sort {
  width: 100%;
  padding: 5px 9px;
  border: 0;
  background: none;
  font-weight: 600;
  text-align: inherit;
  white-space: nowrap;
  cursor: pointer;
}
.sort:hover {
  background: #e6e6e6;
}
.grid th:not([aria-sort='none']) {
  color: var(--accent);
}

/* ---------- the side panel ---------- */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(0, 0, 0, 0.3);
  opacity: 0;
  pointer-events: none;
}
.scrim.on {
  opacity: 1;
  pointer-events: auto;
}
.panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 11;
  display: none;
  flex-direction: column;
  width: 500px;
  max-width: 100%;
  border-left: 1px solid var(--line);
  background: var(--sheet);
  box-shadow: -4px 0 16px rgba(0, 0, 0, 0.18);
}
.panel.on {
  display: flex;
}
.panel:focus {
  outline: none;
}
.panel header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px 8px;
  border-bottom: 1px solid var(--grid);
}
.panel h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}
.panel .chips {
  margin-top: 4px;
}
.panel .x {
  margin-left: auto;
  border: 0;
  background: none;
  color: var(--mute);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}
.panel .body {
  flex: 1;
  overflow: auto;
  padding: 12px 14px;
}
.panel .body > b {
  display: block;
  margin-top: 4px;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--grid);
}
.panel .foot {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 7px 14px;
  border-top: 1px solid var(--grid);
  background: var(--chrome);
}
.panel .grid2 {
  gap: 10px;
}
.field {
  margin-bottom: 8px;
}
.field label {
  display: block;
  margin-bottom: 2px;
  color: var(--mute);
  font-size: 12px;
}
.field input,
.field select {
  width: 100%;
}
.field input[data-set] {
  width: 260px;
}
/* The usage message, shown exactly as it is sent. */
.sent {
  margin: 0;
  padding: 8px 10px;
  border: 1px solid var(--grid);
  background: var(--chrome);
  font:
    12px/1.4 Consolas,
    Menlo,
    monospace;
  white-space: pre-wrap;
}
.pick {
  margin-top: 12px;
  padding: 10px;
  border: 1px solid var(--line);
  background: var(--chrome);
}
#rp {
  margin-top: 8px;
}

/* A job's route: a filled mark for each step reported, a ring for the latest. */
.tl {
  margin: 6px 0 12px;
  padding: 0;
  list-style: none;
}
.tl li {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: center;
  gap: 0 6px;
  padding: 3px 0;
}
.tl li::before {
  content: '';
  justify-self: center;
  width: 8px;
  height: 8px;
  border: 1px solid #a6a6a6;
}
.tl .w {
  color: var(--mute);
  font-size: 12px;
}
.tl .todo {
  color: var(--faint);
}
.tl .done::before {
  border-color: var(--accent);
  background: var(--accent);
}
.tl .now {
  font-weight: 600;
}
.tl .now::before {
  border: 2px solid var(--accent);
}
.tl.log li::before {
  width: 4px;
  height: 4px;
  border: 0;
  background: var(--faint);
}
/* The first-day checklist numbers its steps and ticks the ones done. */
.tl.setup {
  margin: 0;
  padding: 0 10px;
  counter-reset: step;
}
.tl.setup li {
  padding: 6px 0;
  border-bottom: 1px solid var(--grid);
  color: var(--ink);
  counter-increment: step;
}
.tl.setup li:last-child {
  border-bottom: 0;
}
.tl.setup li::before {
  content: counter(step) '.';
  width: auto;
  height: auto;
  border: 0;
  color: var(--mute);
}
.tl.setup .done::before {
  content: '✓';
  background: none;
  color: var(--green);
  font-weight: 600;
}

/* The panel docked beside Today as a reading pane. Its actions move up under the title. */
body.pane main {
  padding: 10px 0 0;
}
body.pane .inbox > .head,
body.pane .inbox > .small {
  padding: 0 12px;
}
body.pane .inbox .card {
  margin-bottom: 0;
  border-right: 0;
  border-left: 0;
}
body.pane .scrim,
body.pane .panel .x,
body.pane .panel .closer {
  display: none;
}
body.pane .panel {
  position: static;
  display: flex;
  flex: 0 0 44%;
  min-width: 380px;
  max-width: 640px;
  box-shadow: none;
}
body.pane .panel .foot {
  order: 1;
  border-top: 0;
  border-bottom: 1px solid var(--grid);
}
body.pane .panel .body {
  order: 2;
}
/* A form keeps its buttons after its last field. */
body.pane .panel .foot.end {
  order: 3;
  border-top: 1px solid var(--grid);
  border-bottom: 0;
}
body.pane .panel:not(.on) {
  align-items: center;
  justify-content: center;
  background: var(--chrome);
}
body.pane .panel:not(.on) > * {
  display: none;
}
body.pane .panel:not(.on)::before {
  content: 'Select a job to read it';
  color: var(--mute);
}

/* ---------- single screens ---------- */

/* Expedites: share of fees that bought a missed date. */
.bar {
  vertical-align: middle;
  border: 1px solid var(--line);
}
.bar rect {
  fill: var(--red);
}

/* Processors */
.grp td {
  background: var(--chrome);
  font-weight: 600;
}
.grp .small {
  font-weight: 400;
}
.indent {
  padding-left: 22px;
}
.turns span {
  margin-right: 0.6em;
}
.chip.quote::before {
  display: none;
}
.chip.quote {
  font-weight: 600;
}
/* Import: the step in hand is bold. */
.steps {
  display: flex;
  gap: 18px;
  margin-bottom: 10px;
  color: var(--mute);
}
.steps .on {
  color: var(--ink);
  font-weight: 600;
}
body.drag::after {
  content: 'Drop the file to import it';
  position: fixed;
  inset: 12px;
  z-index: 50;
  display: grid;
  place-items: center;
  border: 2px dashed var(--accent);
  background: rgba(255, 255, 255, 0.92);
  color: var(--accent);
  font-size: 22px;
  font-weight: 600;
  pointer-events: none;
}

/* For your IT: a topic and what is true of it. */
.facts table,
.facts + .small {
  max-width: 820px;
}
.facts th {
  position: static;
  width: 26%;
  background: none;
  vertical-align: top;
  white-space: normal;
}
.facts td {
  white-space: normal;
}
.facts tr:last-child th {
  border-bottom: 0;
}

/* ---------- toast ---------- */

.toast {
  position: fixed;
  bottom: 34px;
  left: 50%;
  z-index: 60;
  padding: 7px 14px;
  background: #323130;
  color: #fff;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%);
  transition: opacity 0.15s;
}
.toast.on {
  opacity: 1;
  pointer-events: auto;
}
.toast button {
  margin-left: 14px;
  padding: 0 8px;
  border: 1px solid #8a8886;
  border-radius: 2px;
  background: none;
  color: #fff;
  cursor: pointer;
}

/* ---------- tour ---------- */

.tourblock {
  position: fixed;
  inset: 0;
  z-index: 9000;
}
/* The spotlight: a transparent box whose shadow dims everything else. */
.tourhole {
  position: fixed;
  z-index: 9001;
  border: 2px solid #fff;
  box-shadow: 0 0 0 200vmax rgba(0, 0, 0, 0.5);
  pointer-events: none;
}
.tourpop {
  position: fixed;
  z-index: 9002;
  width: 330px;
  max-width: calc(100vw - 24px);
  padding: 10px 12px;
  border: 1px solid var(--line);
  background: var(--sheet);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
}
.tourpop .tn {
  color: var(--mute);
  font-size: 12px;
}
.tourpop h3 {
  margin: 2px 0 5px;
  font-size: 15px;
}
.tourpop p {
  margin: 0 0 10px;
}
.tourpop .ta {
  display: flex;
  align-items: center;
  gap: 6px;
}
.tourpop .skip {
  padding: 0;
  border: 0;
  background: none;
  color: var(--mute);
  text-decoration: underline;
  cursor: pointer;
}

/* ---------- narrow screens ---------- */

@media (max-width: 900px) {
  nav {
    width: 130px;
  }
  .status .keys,
  .banner .sp {
    display: none;
  }
  .tb .name {
    width: auto;
  }
  .grid2 {
    grid-template-columns: 1fr;
  }
  .banner {
    flex-wrap: wrap;
    row-gap: 3px;
  }
  .tiles {
    grid-auto-flow: row;
  }
  .tile {
    border-right: 0;
    border-bottom: 1px solid var(--grid);
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

/* ---------- print ---------- */

/* The call sheet is in the page all the time and shown only on paper, in place of Today. */
.psheet {
  display: none;
}
@media print {
  .banner,
  nav,
  .tb,
  .status,
  .toast,
  .panel,
  .scrim,
  .head .btn,
  .tourblock,
  .tourhole,
  .tourpop,
  .scr,
  body.pscore #view > :not(.score),
  body.pscore #pscore {
    display: none !important;
  }
  html,
  body {
    height: auto;
  }
  body,
  .app {
    display: block;
  }
  main {
    overflow: visible;
    padding: 12px 0;
  }
  .card,
  .tiles {
    break-inside: avoid;
  }
  /* Paper is narrower than the screen and nothing scrolls, so tables tighten up to fit the sheet. */
  .card {
    overflow: visible;
  }
  th,
  td {
    position: static;
    padding: 4px 6px;
    font-size: 12px;
  }

  .psheet {
    display: block;
    color: #000;
    font-size: 11px;
  }
  .psheet .ph {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 2px solid #000;
  }
  .psheet .ph b {
    font-size: 15px;
  }
  .psheet .pg {
    margin-bottom: 10px;
    break-inside: avoid;
  }
  .psheet h3 {
    margin: 0 0 2px;
    font-size: 12px;
  }
  .psheet h3 span {
    margin-left: 8px;
    font-weight: 400;
  }
  .psheet table {
    table-layout: fixed;
  }
  .psheet th,
  .psheet td,
  .psheet tbody tr:last-child td {
    padding: 3px 5px;
    border: 1px solid #000;
    background: none;
    color: #000;
    font-size: 10.5px;
    overflow-wrap: break-word;
    vertical-align: top;
    white-space: normal;
  }
  .psheet th {
    font-size: 9px;
  }
  .psheet td {
    height: 30px;
  }
  .psheet th:nth-child(1) {
    width: 11%;
  }
  .psheet th:nth-child(2) {
    width: 13%;
  }
  .psheet th:nth-child(3),
  .psheet th:nth-child(4) {
    width: 7%;
  }
  .psheet td:nth-child(3),
  .psheet td:nth-child(4) {
    white-space: nowrap;
  }
  .psheet th:nth-child(5) {
    width: 33%;
  }
  .psheet th:nth-child(6) {
    width: 21%;
  }
  .psheet th:nth-child(7) {
    width: 8%;
  }
  .psheet .pf {
    margin-top: 6px;
    font-size: 9.5px;
  }
}
</style>

const USAGE_ENDPOINT=null;
/* calc.js: every figure and every drafted sentence OSP Watch shows. No DOM, no storage, no clock: today is
   always passed in as T.

   Dates are 'YYYY-MM-DD' strings throughout, so they compare and sort as text.

   job     { id, jn?, po, proc, process, q, qty, sent, due, carrier, trk, ev, open, exp, pre?, upd? }
             q    quoted turn in days
             jn   the job number as typed, when id had to be made unique ('1234 #2' for a second operation)
             exp  { fee, bought, by } when an expedite was paid, else null
             pre  true when the job was already out on the day the shop started using the tool
             upd  time of the last edit, used when two copies of a job are merged
   event   { m, d, t? } where m is the step: sent, delivered, received, racked, in_process, processed, inspected,
             shipped, back, newdate, ask. A newdate carries `to`, an ask carries `what`, a shipped may carry `trk`,
             and a back may carry outcome ('rework' | 'reject') with pcs, the pieces affected.
   status  statusOf(j, T) -> { k, action, since, due, asked, lastAns }. action is true when the job belongs on
             Today. k is one of:
               xmiss   expedite date passed          dnc      delivered, receipt not confirmed
               late    past due                      chk      no delivery logged after two days
               xrisk   expedite due within 2 days    due2     due within 2 days, no ship notice
               mid     midpoint check due            transit, ontrack, newdate, shipped, back

   Tests: calc.test.cjs. */

const DAY_MS = 864e5;
const dayNum = (s) => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)) / DAY_MS;
const isoDay = (n) => new Date(n * DAY_MS).toISOString().slice(0, 10);
const addDays = (s, k) => isoDay(dayNum(s) + k);
const dayOfWeek = (s) => (dayNum(s) + 4) % 7; /* 0 = Sunday; day 0 of the epoch was a Thursday */
/* Checks are never due on a weekend: one that would land on Saturday or Sunday moves to Monday. */
const isWeekend = (s) => dayOfWeek(s) % 6 === 0;
function nextWorkday(s) {
  while (isWeekend(s)) s = addDays(s, 1);
  return s;
}
function addWorkdays(s, n) {
  for (; n > 0; n--) s = nextWorkday(addDays(s, 1));
  return s;
}
const isDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) && isoDay(dayNum(s)) === s;

function median(sorted) {
  const n = sorted.length;
  return n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
}
const mean = (a) => a.reduce((s, x) => s + x, 0) / a.length;
const byText = (key) => (a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0);

/* Carriers where the shop itself hands the parts over, so sending and delivery are the same moment. */
const OWN_DELIVERY = /\b(driver|truck|hand|drop(ped)?[ -]?off|will[ -]?call)\b/i;
const PROC_STEPS = ['received', 'racked', 'in_process', 'processed', 'inspected', 'shipped'];
const STEP_LABEL = {
  sent: 'Sent to processor',
  delivered: 'Carrier delivered',
  received: 'Processor confirmed receipt',
  racked: 'Masked / racked',
  in_process: 'In process',
  processed: 'Processed',
  inspected: 'Inspected',
  shipped: 'Shipped back',
  back: 'Received back at shop',
  newdate: 'New date given',
};
const isAnswer = (e) => PROC_STEPS.includes(e.m) || e.m === 'newdate';

/* ---------- status ---------- */

/** The latest event of the given steps, or null. */
function last(j, steps) {
  let r = null;
  for (const e of j.ev) if (steps.includes(e.m) && (!r || e.d >= r.d)) r = e;
  return r;
}
const isBack = (j) => j.ev.some((e) => e.m === 'back');
function effDue(j) {
  const n = last(j, ['newdate']);
  return n ? n.to : j.due;
}
const answered = (j, since) => j.ev.some((e) => isAnswer(e) && e.d >= since);
const midDate = (j) => nextWorkday(addDays(j.sent, Math.floor((j.q || dayNum(j.due) - dayNum(j.sent)) / 2)));

function statusOf(j, T) {
  const has = (m) => j.ev.some((e) => e.m === m);
  const due = effDue(j);
  const exp = j.exp;
  const delivered = last(j, ['delivered']);
  /* A job that was already out when the shop started is not asked "did our parts arrive?" weeks after the
     fact. It is picked up at the midpoint instead. */
  const receiptKnown = !!j.pre || j.ev.some(isAnswer);
  let k;
  let since = null;
  if (has('back')) k = 'back';
  else if (has('shipped')) k = 'shipped';
  else if (exp && T > exp.by) {
    k = 'xmiss';
    since = addDays(exp.by, 1);
  } else if (T > due) {
    k = 'late';
    since = addDays(due, 1);
  } else if (exp && dayNum(exp.by) - dayNum(T) <= 2) {
    k = 'xrisk';
    since = addDays(exp.by, -2);
  } else if (delivered && !receiptKnown) {
    k = 'dnc';
    since = delivered.d;
  } else if (!delivered && !receiptKnown) {
    /* Two working days with no delivery logged: parts sent on a Friday are not chased on Sunday. */
    const checkFrom = addWorkdays(j.sent, 2);
    if (T >= checkFrom) {
      k = 'chk';
      since = checkFrom;
    } else k = 'transit';
  } else if (dayNum(due) - dayNum(T) <= 2) {
    k = 'due2';
    since = addDays(due, -2);
  } else if (T >= midDate(j) && !answered(j, midDate(j))) {
    k = 'mid';
    since = midDate(j);
  } else k = has('newdate') ? 'newdate' : 'ontrack';

  /* An answer settles most checks for good. A job that is past due is different: an answer without a new
     date quiets it for that day only, and it is back on the list the next morning. */
  const overdue = k === 'late' || k === 'xmiss';
  const asks = j.ev.filter((e) => e.m === 'ask' && e.d === T);
  return {
    k,
    since,
    action: !!since && (k === 'chk' || !answered(j, overdue ? T : since)),
    due,
    asked: asks.length ? asks[asks.length - 1] : null,
    lastAns: last(j, PROC_STEPS.concat(['newdate'])),
  };
}

/* ---------- expedites ---------- */

/** One row per expedite paid, newest first. res is 'met', 'missed' or 'open'. */
function ledger(J, T) {
  return J.filter((j) => j.exp)
    .map((j) => {
      const b = last(j, ['back']);
      const back = b ? b.d : null;
      const res = back ? (back <= j.exp.by ? 'met' : 'missed') : T > j.exp.by ? 'missed' : 'open';
      return {
        id: j.id,
        jn: j.jn || j.id,
        proc: j.proc,
        process: j.process,
        qty: j.qty,
        fee: j.exp.fee,
        bought: j.exp.bought,
        by: j.exp.by,
        back,
        res,
        days: res === 'missed' ? dayNum(back || T) - dayNum(j.exp.by) : 0,
      };
    })
    .sort((a, b) => -byText((x) => x.bought)(a, b));
}

/** Expedite fees per processor, the most money missed first. */
function expByProc(J, T) {
  const g = Object.create(null);
  for (const x of ledger(J, T)) {
    const p = (g[x.proc] = g[x.proc] || { proc: x.proc, n: 0, fees: 0, met: 0, missed: 0, open: 0, n_missed: 0 });
    p.n++;
    p.fees += x.fee;
    p[x.res] += x.fee;
    if (x.res === 'missed') p.n_missed++;
  }
  return Object.values(g).sort((a, b) => b.missed - a.missed || b.fees - a.fees);
}

/* ---------- processors ---------- */

/** Real turn time per processor and process, from jobs that came back. */
function procStats(J) {
  const groups = Object.create(null);
  for (const j of J) {
    const b = last(j, ['back']);
    /* An expedited turn was paid for; it says nothing about the processor's normal turn. */
    if (!b || j.exp) continue;
    const key = j.proc + '|' + j.process;
    const g = (groups[key] = groups[key] || { proc: j.proc, process: j.process, quotes: [], t: [] });
    g.t.push({ sent: j.sent, due: j.due, back: b.d, turn: dayNum(b.d) - dayNum(j.sent) });
    g.quotes.push(j.q);
  }
  return Object.values(groups)
    .map((g) => {
      g.t.sort(byText((x) => x.sent));
      const turns = g.t.map((x) => x.turn);
      const sorted = [...turns].sort((a, b) => a - b);
      const n = sorted.length;
      g.quotes.sort((a, b) => a - b);

      /* Least-squares slope of turn time against the date sent, in days of turn per day. */
      const xs = g.t.map((x) => dayNum(x.sent));
      const mx = mean(xs);
      const my = mean(turns);
      const sxx = xs.reduce((a, x) => a + (x - mx) ** 2, 0);
      const slope = sxx ? xs.reduce((a, x, i) => a + (x - mx) * (turns[i] - my), 0) / sxx : 0;
      const span = Math.max(...xs) - Math.min(...xs);

      return {
        proc: g.proc,
        process: g.process,
        q: g.quotes[Math.floor((g.quotes.length - 1) / 2)],
        n,
        med: median(sorted),
        p80: sorted[Math.ceil(0.8 * n) - 1],
        turns,
        sent: g.t.map((x) => x.sent),
        last5: turns.slice(-5),
        ontime: g.t.filter((x) => x.back <= x.due).length / n,
        /* Days the turn has grown: over six months when there are four or more months of history,
           otherwise over the history there is. */
        trend: Math.round(slope * (span >= 120 ? 180 : span)),
        open: J.filter((j) => j.open && !isBack(j) && j.proc === g.proc && j.process === g.process).length,
      };
    })
    .sort((a, b) => byText((p) => p.proc)(a, b) || byText((p) => p.process)(a, b));
}

/** One row per processor for a supplier review. Every job that came back counts, expedited ones too, and
    on time means back by the original due date. */
function scorecards(J, T) {
  const g = Object.create(null);
  const row = (proc) =>
    (g[proc] = g[proc] || {
      proc,
      n: 0,
      ontime: 0,
      lateDays: [],
      rework: 0,
      reject: 0,
      pcs: 0,
      exp: 0,
      exp_missed: 0,
      open: 0,
      open_late: 0,
    });
  for (const j of J) {
    const r = row(j.proc);
    const b = last(j, ['back']);
    if (!b) {
      if (j.open) {
        r.open++;
        if (effDue(j) < T) r.open_late++;
      }
      continue;
    }
    r.n++;
    const lateBy = dayNum(b.d) - dayNum(j.due);
    if (lateBy <= 0) r.ontime++;
    else r.lateDays.push(lateBy);
    if (b.outcome === 'rework') r.rework++;
    if (b.outcome === 'reject') r.reject++;
    if (b.outcome) r.pcs += b.pcs || 0;
  }
  for (const x of ledger(J, T)) {
    const r = row(x.proc);
    r.exp++;
    if (x.res === 'missed') r.exp_missed++;
  }
  return Object.values(g)
    .map(({ lateDays, ...r }) => {
      lateDays.sort((a, b) => a - b);
      return { ...r, late: lateDays.length, med_late: lateDays.length ? median(lateDays) : 0 };
    })
    .sort(byText((r) => r.proc));
}

/* ---------- monthly summary ---------- */

/** This month to date. A = { calls_per_job, min_per_call, min_per_email }, the shop's own estimates. */
function summary(J, T, A) {
  const M = T.slice(0, 8) + '01';
  const inMonth = (d) => d >= M && d <= T;
  let received = 0;
  let same_day = 0;
  let dnc = 0;
  const slips = [];
  for (const j of J) {
    const delivered = last(j, ['delivered']);
    const first = j.ev.filter((e) => PROC_STEPS.includes(e.m)).sort(byText((e) => e.d))[0];
    if (first && inMonth(first.d)) {
      received++;
      if (delivered && delivered.d === first.d) same_day++;
    }
    if (delivered && inMonth(delivered.d) && (!first || first.d > delivered.d)) dnc++;

    /* A slip counts as caught early when the new date was learned before the original due date. */
    const moved = j.ev.find((e) => e.m === 'newdate' && inMonth(e.d));
    if (moved && moved.d < j.due)
      slips.push({
        id: j.id,
        jn: j.jn || j.id,
        proc: j.proc,
        process: j.process,
        due: j.due,
        learned: moved.d,
        to: moved.to,
        early: dayNum(j.due) - dayNum(moved.d),
      });
  }
  const L = ledger(J, T).filter((x) => inMonth(x.bought));
  const fees = (res) => L.filter((x) => !res || x.res === res).reduce((a, x) => a + x.fee, 0);
  const asks = J.reduce((a, j) => a + j.ev.filter((e) => e.m === 'ask' && inMonth(e.d)).length, 0);
  const active = J.filter((j) => {
    const b = last(j, ['back']);
    return j.sent <= T && (!b || b.d >= M);
  }).length;
  const before = active * A.calls_per_job * A.min_per_call;
  const after = asks * A.min_per_email;
  return {
    month: M,
    sent: J.filter((j) => inMonth(j.sent)).length,
    received,
    same_day,
    dnc,
    slips,
    early_avg: slips.length ? mean(slips.map((s) => s.early)) : 0,
    exp: {
      n: L.length,
      fees: fees(),
      met: fees('met'),
      missed: fees('missed'),
      open: fees('open'),
      n_met: L.filter((x) => x.res === 'met').length,
      n_missed: L.filter((x) => x.res === 'missed').length,
    },
    active,
    asks,
    before,
    after,
    hours_saved: Math.round((before - after) / 30) / 2 /* minutes, to the nearest half hour */,
  };
}

/* ---------- words ---------- */

const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const fmtDate = (s) => MONTHS_SHORT[+s.slice(5, 7) - 1] + ' ' + +s.slice(8, 10); /* Nov 23 */
const fmtDay = (s) => WEEKDAYS[dayOfWeek(s)].slice(0, 3) + ', ' + fmtDate(s); /* Mon, Nov 23 */
/** '14:05' -> '2:05 PM' */
function fmtTime(t) {
  if (!t) return '';
  const h = +t.slice(0, 2);
  return (h % 12 || 12) + ':' + t.slice(3) + (h >= 12 ? ' PM' : ' AM');
}
/** A date as it would be said on T: today, yesterday, tomorrow, 'on Fri, Nov 20' within the past week. */
function relDay(s, T) {
  const k = dayNum(s) - dayNum(T);
  if (k === 0) return 'today';
  if (k === -1) return 'yesterday';
  if (k === 1) return 'tomorrow';
  return (k < 0 && k > -7 ? 'on ' : '') + fmtDay(s);
}

/* ---------- drafts ---------- */

const DEFAULT_SIGN = 'Purchasing, Example Shop';
const MASKED_PROCESS = /plat|nickel|anodi[sz]|chem|film|coat|paint|prim|passivat/i;
const letter = (proc, text, sign) => `Hi ${proc} team,\n\n${text}\n\nThank you,\n${sign || DEFAULT_SIGN}`;

/* Each draft asks for a physical step or a date, never "are we on track?", because a step can be checked. */
function draftText(j, s, T) {
  const id = j.jn || j.id;
  const ref = j.po ? ` (PO ${j.po})` : '';
  const what = j.qty ? `${j.qty} pcs` : 'parts';
  const proc = j.process ? `, ${j.process}` : '';
  const exp = j.exp;
  switch (s.k) {
    case 'dnc': {
      const carrier = j.carrier || '';
      const who = OWN_DELIVERY.test(carrier)
        ? 'our driver dropped off'
        : /courier/i.test(carrier)
          ? 'the courier shows delivered'
          : `${carrier.split(' ')[0] || 'the carrier'} shows delivered`;
      const d = last(j, ['delivered']);
      const at = d.t ? ` at ${fmtTime(d.t)}` : '';
      const when = d.d !== T ? relDay(d.d, T) + at : d.t && +d.t.slice(0, 2) < 12 ? 'this morning' + at : 'today' + at;
      return {
        subject: `Job ${id}: did our ${what} arrive?`,
        text: `Can you confirm you received our ${what} for job ${id}${ref} that ${who} ${when}? A quick reply with the date you logged them in is all we need.`,
      };
    }
    case 'chk': {
      const by = j.carrier ? ` by ${j.carrier}` : '';
      const trk = j.trk ? ` (tracking ${j.trk})` : '';
      return {
        subject: `Job ${id}: did our ${what} arrive?`,
        text: `We sent ${what} for job ${id}${ref} to you on ${fmtDay(j.sent)}${by}${trk}. Can you confirm you have them, and the date you logged them in?`,
      };
    }
    case 'due2':
      return {
        subject: `Job ${id}: has it shipped?`,
        text: `Job ${id} (${what}${proc})${ref} is due back ${relDay(s.due, T)}. Has it shipped? If it has, could you send the tracking number; if not, which step is it at and what day will it ship?`,
      };
    case 'late':
      return {
        subject: `Job ${id}: past due, what day will it ship?`,
        text: `Job ${id} (${what}${proc})${ref} was due back ${fmtDay(s.due)} and we have not received it or a ship notice. Which step is it at now, and what day will it ship? If something on our side is holding it up, let us know and we will sort it out.`,
      };
    case 'xmiss':
      return {
        subject: `Job ${id}: expedite date passed, what day will it ship?`,
        text: `We paid a $${exp.fee} expedite on ${fmtDay(exp.bought)} for job ${id} (${what}${proc})${ref} to be back by ${fmtDay(exp.by)}, and we have not received it or a ship notice. Which step is it at now, and what day will it ship?`,
      };
    case 'xrisk': {
      const a = s.lastAns;
      const lastUpdate = a ? ` Your last update was "${STEP_LABEL[a.m].toLowerCase()}" on ${fmtDay(a.d)}.` : '';
      return {
        subject: `Job ${id}: expedite due ${fmtDay(exp.by)}`,
        text: `We paid a $${exp.fee} expedite on ${fmtDay(exp.bought)} for job ${id} (${what}${proc}) to be back by ${fmtDay(exp.by)}.${lastUpdate} Is it on track to ship in time? If not, please tell us today so we can plan around it.`,
      };
    }
    default: {
      const first = j.ev.filter((e) => PROC_STEPS.includes(e.m)).sort(byText((e) => e.d))[0];
      const process = j.process ? ` (${j.process})` : '';
      const reached = first ? ` reached you on ${fmtDay(first.d)} and` : '';
      /* Only a finishing house masks and racks. A heat treater, a grinder or a lab is asked a shorter question. */
      const steps = MASKED_PROCESS.test(j.process)
        ? 'received, masked or racked, in process, processed, or in inspection'
        : 'received, in process, finished, or in inspection';
      return {
        subject: `Job ${id}: which step is it at?`,
        text: `Our ${what} for job ${id}${ref}${process}${reached} are due back ${fmtDay(s.due)}. Which step are they at right now: ${steps}?`,
      };
    }
  }
}

/** The email for one job in status s. */
function draftFor(j, s, T, sign) {
  const { subject, text } = draftText(j, s, T);
  return { subject, body: letter(j.proc, text, sign) };
}

/** One email covering every job at one processor that needs a word today. items = [[job, status], ...]. */
function draftForProc(items, T, sign) {
  const ids = items.map(([j]) => j.jn || j.id);
  const lines = items.map(([j, s], i) => `${i + 1}. ${draftText(j, s, T).text}`);
  return {
    subject: `${items.length} jobs: quick status check (${ids.join(', ')})`,
    body: letter(
      items[0][0].proc,
      `We have ${items.length} jobs with you that need a quick word today.\n\n${lines.join('\n\n')}`,
      sign,
    ),
  };
}

/** The credit request for an expedite whose date was missed. */
function creditDraft(j, T, sign) {
  const id = j.jn || j.id;
  const ref = j.po ? ` (PO ${j.po})` : '';
  const what = j.qty ? `${j.qty} pcs` : 'parts';
  const proc = j.process ? `, ${j.process}` : '';
  const { fee, bought, by } = j.exp;
  const back = last(j, ['back']);
  const shipped = last(j, ['shipped']);
  const outcome = back
    ? `It came back on ${fmtDay(back.d)}.`
    : shipped
      ? `It shipped on ${fmtDay(shipped.d)}.`
      : 'As of today it has not shipped.';
  const stillOut = back || shipped ? '' : ' Could you also tell us which step it is at and what day it will ship?';
  return {
    subject: `Job ${id}: expedite credit request`,
    body: letter(
      j.proc,
      `On ${fmtDay(bought)} we paid a $${fee} expedite for job ${id} (${what}${proc})${ref} to be back by ${fmtDay(by)}. ${outcome} The expedited date was missed. Would you be able to credit the $${fee} expedite charge?${stillOut}`,
      sign,
    ),
  };
}

/** A mailto: link. The address is encoded too, so a stored contact cannot add its own cc, bcc or body. */
function mailto(to, d) {
  const addr = encodeURIComponent(String(to || '').trim()).replace(/%40/g, '@');
  return `mailto:${addr}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.body)}`;
}

/* ---------- reading a processor's reply ---------- */

/* The thread underneath a reply is dropped first. It holds our own question ("has it shipped?"), which
   would otherwise read as their answer. */
function replyOnly(txt) {
  const cut = txt.search(/\n[ \t]*(>|On .{0,80}wrote:|-{2,} ?Original Message|From: )/i);
  return cut < 0 ? txt : txt.slice(0, cut);
}

/* Furthest step first: "received Monday, shipped today" means shipped. */
const REPLY_STEPS = [
  ['shipped', /\b(shipped|on its way|on the truck|picked up|went out|left (?:here|our dock))\b/g],
  ['inspected', /\b(inspected|in (?:final )?inspection|at inspection|passed inspection)\b/g],
  ['processed', /\b(processed|out of the tank|finished|completed?|done|plated|anodized|coated|heat treated)\b/g],
  [
    'in_process',
    /\b(in process|in the tank|running (?:it|them|now)|started|in work|on the line|in the oven|being (?:plated|anodized|coated|treated|run))\b/g,
  ],
  ['racked', /\b(masked|masking|racked|racking)\b/g],
  [
    'received',
    /\b(received|got (?:them|the parts|your parts)|have (?:them|the parts|your parts)|logged (?:them |it )?in|checked in|arrived|in[ -]house)\b/g,
  ],
];
/* Words just before a step that mean it has not happened: "not shipped", "will be done", "once it is finished". */
const NOT_YET =
  /(\bnot|n't|\bno|\bnever|\bnothing|\bwill|'ll|\bgoing(?: to)?|\bshould|\bexpect(?:ed|ing)?(?: to)?|\bplan(?:ning)?(?: to)?|\bto|\bwhen|\bonce|\buntil|\bafter|\bas soon as)(?: yet| been| be| have| has| is| are| it| it's| they| they're| them| be able to)* $/;
/* A date only counts when one of these words comes shortly before it in the same sentence. */
const DATE_CUE =
  /\b(ship(?:ped|ping|s)?|back|ready|done|finish(?:ed)?|complete[d]?|eta|looking at|expect(?:ed|ing)?|by|until|out)\b[^.!?]{0,40}$/;
/* "1-2 days" and "2-3 weeks" are durations, not dates. */
const NUMERIC_DATE =
  /\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{4}|\d{2}))?\b(?! ?(?:business |working |more )?(?:days?|weeks?|wks?|hours?|hrs?|pcs|pieces|parts)\b)/g;
const NAMED_DATE = /\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.? (\d{1,2})(?:st|nd|rd|th)?\b/g;
const WEEKDAY_DATE = /\b(?:(next) )?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/g;
/* UPS (1Z...) and the FedEx lengths. A long number that is not a tracking number can match, which is why the
   person confirms what was picked out before it is logged. */
const TRACKING = /\b(1Z[0-9A-Z]{16}|\d{12}|\d{15}|\d{20,22})\b/i;

/** What a pasted reply says: { m: the step or null, date: a new date after T or null, trk }. A suggestion
    for the person to confirm, never logged by itself. */
function parseReply(txt, T) {
  const raw = replyOnly(String(txt || ''));
  const s = ' ' + raw.toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, ' ') + ' ';

  let step = null;
  for (const [name, re] of REPLY_STEPS) {
    re.lastIndex = 0;
    for (let x; !step && (x = re.exec(s)); ) if (!NOT_YET.test(s.slice(0, x.index))) step = name;
    if (step) break;
  }

  const year = +T.slice(0, 4);
  const iso = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const cued = (i) => DATE_CUE.test(s.slice(0, i));
  const dates = [];
  /* A date written without a year that fell more than six months ago means next year ("Jan 5" said in December). */
  const thisYearOrNext = (m, d) => {
    const date = iso(year, m, d);
    return dayNum(T) - dayNum(date) > 180 ? iso(year + 1, m, d) : date;
  };
  for (const x of s.matchAll(NUMERIC_DATE)) {
    if (!cued(x.index)) continue;
    dates.push(x[3] ? iso(x[3].length === 2 ? '20' + x[3] : x[3], x[1], x[2]) : thisYearOrNext(x[1], x[2]));
  }
  for (const x of s.matchAll(NAMED_DATE)) {
    if (cued(x.index)) dates.push(thisYearOrNext(MONTHS_SHORT.findIndex((m) => m.toLowerCase() === x[1]) + 1, x[2]));
  }
  for (const x of s.matchAll(WEEKDAY_DATE)) {
    if (!cued(x.index)) continue;
    let ahead = (WEEKDAYS.findIndex((w) => w.toLowerCase() === x[2]) - dayOfWeek(T) + 7) % 7;
    if (ahead === 0 || x[1]) ahead += 7;
    if (x[1] && ahead > 13) ahead -= 7;
    dates.push(addDays(T, ahead));
  }
  const tomorrow = s.indexOf(' tomorrow');
  if (tomorrow >= 0 && cued(tomorrow + 1)) dates.push(addDays(T, 1));
  if (/\bend of (?:the |this )?week\b/.test(s)) dates.push(addDays(T, (5 - dayOfWeek(T) + 7) % 7 || 7));

  const future = dates.filter((d) => isDate(d) && d > T).sort();
  const trk = raw.match(TRACKING);
  return { m: step, date: future.length ? future[future.length - 1] : null, trk: trk ? trk[1].toUpperCase() : '' };
}

/* ---------- import ---------- */

/** An Excel day serial as a date. Serials outside roughly 1955 to 2119 are some other number, not a date. */
function excelDate(n) {
  n = Math.floor(+n);
  return n > 20000 && n < 80000 ? isoDay(n - 25569) : null;
}

/** A date cell as 'YYYY-MM-DD', or null. Month comes first in numeric dates, as US shops write them, so a
    day-first date such as 25/12/2026 is refused, not misread. */
function parseDate(v) {
  const s = String(v == null ? '' : v)
    .trim()
    .replace(/[ T]\d{1,2}:\d{2}.*$/, '');
  const year = (y) => (y.length === 2 ? '20' + y : y);
  const month = (name) => MONTHS_SHORT.findIndex((m) => m.toLowerCase() === name.slice(0, 3).toLowerCase()) + 1;
  const iso = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  let m;
  let out = null;
  if (/^\d{5}(\.\d+)?$/.test(s)) return excelDate(s);
  if ((m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/))) out = iso(m[1], m[2], m[3]);
  else if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})$/))) out = iso(year(m[3]), m[1], m[2]);
  else if ((m = s.match(/^(\d{1,2})[ -]([a-z]{3,9})\.?[-, ]+(\d{4}|\d{2})$/i)))
    out = iso(year(m[3]), month(m[2]), m[1]);
  else if ((m = s.match(/^([a-z]{3,9})\.? (\d{1,2}),? (\d{4})$/i))) out = iso(m[3], month(m[1]), m[2]);
  return out && isDate(out) ? out : null;
}

/* The columns the import reads: key, label, and the heading pattern that suggests it. Order matters: each
   heading is claimed by the first field that matches it. Nothing else in a sheet is read or stored. */
const FIELDS = [
  [
    'job',
    'Job number',
    /^(?!.*(date|\bdt\b|due|qty|quant|purchase|sales|\bp ?o\b)).*(job|\bw ?o\b|work ?order|order)/i,
  ],
  ['po', 'PO number', /^(?!.*(date|\bdt\b)).*(\bp ?o\b|purchase)/i],
  ['proc', 'Processor', /vendor|processor|supplier|sub/i],
  ['process', 'Process', /^(?!.*part).*(process|\bop(er|\b)|finish|spec|service)/i],
  ['qty', 'Qty', /qty|quant|pcs/i],
  ['back', 'Date received back', /^(?!.*(exp|due|promis|req)).*(rec|return|came|actual|date in)/i],
  ['due', 'Due back', /due|promis|req|expect/i],
  ['sent', 'Date sent', /^(?!.*(exp|rush)).*(sent|ship.*out|out|date|\bdt\b)/i],
  ['carrier', 'Carrier', /carrier|via/i],
  ['trk', 'Tracking', /track/i],
  ['fee', 'Expedite fee', /exp.*(\$|fee|cost|amt|amount)|rush.*(\$|fee|cost|amt|amount)/i],
  ['by', 'Expedite date', /exp.*(by|date|\bdt\b)|rush.*(by|date|\bdt\b)/i],
];

/* A heading as words: an ERP export writes Due_Date, VendorName or P.O. where a person writes "Due date". */
const headingWords = (h) =>
  String(h)
    .replace(/([a-z])([A-Z])/g, '$1 $2')
    .replace(/[_.\-\/#:]+/g, ' ')
    .trim();

/** A first guess at which column holds which field: { field: column index }. The person corrects it on screen. */
function guessColumns(header) {
  const headings = header.map(headingWords);
  const used = new Set();
  const map = {};
  for (const [field, , re] of FIELDS) {
    const i = headings.findIndex((h, ix) => !used.has(ix) && re.test(h));
    if (i >= 0) {
      map[field] = i;
      used.add(i);
    }
  }
  return map;
}

/** What loading a sheet would do, before anything is changed: jobs to add, jobs on file that the sheet now
    shows as back, due dates the sheet has moved, rows that cannot be used, and rows already on file. */
function planImport(rows, map, J, T) {
  const cell = (r, field) => (map[field] != null && r[map[field]] != null ? String(r[map[field]]).trim() : '');
  const keyOf = (job, proc, process, sent) => [job, proc, process || 'Outside process', sent].join('|').toLowerCase();
  const onFile = new Map(J.map((j) => [keyOf(j.jn || j.id, j.proc, j.process, j.sent), j]));
  const seen = new Set();
  const plan = { add: [], close: [], move: [], skip: 0, same: 0 };

  for (const r of rows.slice(1)) {
    if (!FIELDS.some(([field]) => cell(r, field))) continue;
    const sent = parseDate(cell(r, 'sent'));
    const due = parseDate(cell(r, 'due'));
    const back = parseDate(cell(r, 'back'));
    const row = {
      job: cell(r, 'job'),
      po: cell(r, 'po'),
      proc: cell(r, 'proc'),
      process: cell(r, 'process'),
      qty: parseInt(cell(r, 'qty').replace(/,/g, ''), 10) || 0,
      carrier: cell(r, 'carrier'),
      trk: cell(r, 'trk'),
      sent,
      due,
      back: back && sent && back >= sent && back <= T ? back : null,
      fee: parseFloat(cell(r, 'fee').replace(/[$,]/g, '')) || 0,
      by: parseDate(cell(r, 'by')),
    };
    /* A job staged to go out tomorrow is fine. A send date further out is a typo. */
    if (!row.job || !row.proc || !sent || !due || due < sent || sent > addDays(T, 1)) {
      plan.skip++;
      continue;
    }
    const key = keyOf(row.job, row.proc, row.process, sent);
    const j = onFile.get(key);
    const repeat = seen.has(key);
    seen.add(key);
    const stillOut = j && j.open && !isBack(j);
    if (!j && !repeat) plan.add.push(row);
    else if (stillOut && !repeat && row.back) plan.close.push({ id: j.id, back: row.back });
    /* The sheet moves a due date only when it differs from the date the job was entered with. A sheet that
       still shows the original date does not undo a newer date logged in the tool. */ else if (
      stillOut &&
      !repeat &&
      due !== j.due &&
      due !== effDue(j)
    )
      plan.move.push({ id: j.id, from: effDue(j), to: due });
    else plan.same++;
  }
  return plan;
}

/* ---------- two people, one shared file ---------- */

/** Merge this computer's state (mine) with the shared file's (theirs). Both sides reach the same result
    whoever merges first, and merging again changes nothing.

    Jobs are matched by id and the copy edited last wins. Events and expedites only ever add, a credit only
    moves forward (requested, then credited), and a removed job stays removed on every computer. Settings and
    contacts follow whichever side changed them last. The cost of add-only: an Undo made on one computer after
    another has already synced is brought back by the next merge. */
function mergeState(mine, theirs) {
  const newer = (mine.settingsAt || 0) >= (theirs.settingsAt || 0) ? mine : theirs;
  const older = newer === mine ? theirs : mine;
  const out = { ...older, ...newer };
  const removed = new Set([...(mine.removed || []), ...(theirs.removed || [])]);
  const later = (a, b) => (!a || !b ? a || b : a > b ? a : b);
  const earlier = (a, b) => (!a || !b ? a || b : a < b ? a : b);

  const byId = Object.create(null);
  for (const j of [...(theirs.added || []), ...(mine.added || [])]) {
    if (removed.has(j.id)) continue;
    if (!byId[j.id] || (j.upd || 0) > (byId[j.id].upd || 0)) byId[j.id] = j;
  }
  out.added = Object.values(byId);
  out.removed = [...removed].sort();
  out.started = earlier(mine.started, theirs.started);
  out.lastImport = later(mine.lastImport, theirs.lastImport);

  out.ev = Object.create(null);
  for (const side of [theirs.ev || {}, mine.ev || {}]) {
    for (const id of Object.keys(side)) {
      if (removed.has(id)) continue;
      const list = (out.ev[id] = out.ev[id] || []);
      const seen = new Set(list.map((e) => JSON.stringify(e)));
      for (const e of side[id]) {
        if (seen.has(JSON.stringify(e))) continue;
        seen.add(JSON.stringify(e));
        list.push(e);
      }
      list.sort(byText((e) => e.d + (e.t || '') + e.m));
    }
  }

  /* Where both sides hold a different value for the same job, the choice has to be the same on both
     computers: 'requested' sorts after 'credited', and two expedites are compared as text. */
  const pick = (a, b) => (JSON.stringify(a) <= JSON.stringify(b) ? a : b);
  for (const k of ['exp', 'credit']) {
    out[k] = Object.create(null);
    for (const side of [theirs[k] || {}, mine[k] || {}])
      for (const id of Object.keys(side))
        if (!removed.has(id)) out[k][id] = id in out[k] ? pick(out[k][id], side[id]) : side[id];
  }
  out.contacts = { ...older.contacts, ...newer.contacts };
  for (const k of ['started', 'lastImport']) if (!out[k]) delete out[k];
  return out;
}

/* files.js: reading a shop's spreadsheet and writing one back. No DOM. Tests: files.test.cjs.

   An .xlsx file is a zip of XML parts. Reading one here takes about a hundred lines and the browser's own
   decompressor, which is why the page needs no spreadsheet library. Only cell values are read: formulas are
   never evaluated and macros are never touched. */

/* ---------- delimited text ---------- */

/** Rows of cells from comma- or tab-separated text. Quoted cells may hold the delimiter, quotes and newlines.
    Blank lines are dropped. */
function parseDelimited(text, delimiter) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;
  const endRow = () => {
    row.push(cell);
    cell = '';
    if (row.some((c) => c.trim())) rows.push(row);
    row = [];
  };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c !== '"') cell += c;
      else if (text[i + 1] === '"') {
        cell += '"';
        i++;
      } else quoted = false;
    } else if (c === '"') quoted = true;
    else if (c === delimiter) {
      row.push(cell);
      cell = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      endRow();
    } else cell += c;
  }
  endRow();
  return rows;
}

/** Rows from pasted or loaded text. Cells copied out of Excel arrive tab-separated; a CSV file has commas.
    The header line decides which. */
function parseTable(text) {
  const header = text.replace(/^﻿/, '').split(/\r?\n/, 1)[0];
  const tabbed = header.split('\t').length > header.split(',').length;
  return parseDelimited(text.replace(/^﻿/, ''), tabbed ? '\t' : ',');
}

/** CSV text for Excel. A cell that begins with = + - or @ would run as a formula when the file is opened, so
    it is written with a leading apostrophe, which Excel shows as plain text. */
function toCSV(rows) {
  const cell = (value) => {
    let s = value == null ? '' : String(value);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  /* The byte-order mark tells Excel the file is UTF-8. */
  return '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

/* ---------- zip ---------- */

const ZIP_END_OF_DIRECTORY = 0x06054b50;
const ZIP_DIRECTORY_ENTRY = 0x02014b50;
/* A sheet of a few thousand jobs is well under a megabyte. The cap stops a file built to expand without end. */
const MAX_PART_BYTES = 50 * 1024 * 1024;

async function inflate(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const chunks = [];
  let size = 0;
  for await (const chunk of stream) {
    size += chunk.length;
    if (size > MAX_PART_BYTES) throw new Error('That file is too large to read here.');
    chunks.push(chunk);
  }
  return new Uint8Array(await new Blob(chunks).arrayBuffer());
}

/** The parts of a zip: { names, read(name) -> text or null }. Reads the central directory at the end of the
    file, then each part on demand. Offsets are those of the zip format's fixed-size records. */
function unzip(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  const utf8 = new TextDecoder();
  const u16 = (at) => view.getUint16(at, true);
  const u32 = (at) => view.getUint32(at, true);

  let end = buffer.byteLength - 22;
  while (end >= 0 && u32(end) !== ZIP_END_OF_DIRECTORY) end--;
  if (end < 0) throw new Error('Not a zip file.');

  const parts = new Map();
  let at = u32(end + 16);
  for (let i = 0; i < u16(end + 10) && u32(at) === ZIP_DIRECTORY_ENTRY; i++) {
    const nameLength = u16(at + 28);
    const name = utf8.decode(bytes.subarray(at + 46, at + 46 + nameLength));
    parts.set(name, { stored: u16(at + 10) === 0, size: u32(at + 20), header: u32(at + 42) });
    at += 46 + nameLength + u16(at + 30) + u16(at + 32);
  }
  return {
    names: [...parts.keys()],
    async read(name) {
      const part = parts.get(name);
      if (!part) return null;
      const start = part.header + 30 + u16(part.header + 26) + u16(part.header + 28);
      const data = bytes.subarray(start, start + part.size);
      return utf8.decode(part.stored ? data : await inflate(data));
    },
  };
}

/* ---------- xlsx ---------- */

const xmlText = (s) =>
  s
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
    .replace(/&#(\d+);/g, (_, dec) => String.fromCodePoint(+dec))
    .replace(/&amp;/g, '&');
const textRuns = (xml) => xmlText([...xml.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((m) => m[1]).join(''));
const attr = (tag, name) => (tag.match(new RegExp(`\\b${name}="([^"]*)"`)) || [])[1];

/* Excel stores a date as a number plus a cell style. Format ids 14 to 22 and 45 to 47 are the built-in date
   and time formats; a custom format is a date when it has a d or a y outside quotes and brackets. */
function dateStyles(stylesXml) {
  if (!stylesXml) return [];
  const custom = {};
  for (const m of stylesXml.matchAll(/<numFmt [^>]*numFmtId="(\d+)"[^>]*formatCode="([^"]*)"/g)) custom[m[1]] = m[2];
  const cellFormats = (stylesXml.match(/<cellXfs[\s\S]*?<\/cellXfs>/) || [''])[0];
  return [...cellFormats.matchAll(/<xf [^>]*numFmtId="(\d+)"/g)].map(([, id]) => {
    const code = (custom[id] || '').replace(/"[^"]*"|\[[^\]]*\]/g, '');
    return (id >= 14 && id <= 22) || (id >= 45 && id <= 47) || /[dy]/i.test(code);
  });
}

/* The first tab of the workbook, as Excel orders them. The file names (sheet1.xml, sheet2.xml) follow the
   order the tabs were created in, which is not always the order they are shown in. */
async function firstSheetPath(zip, workbookXml) {
  const firstTab = (workbookXml.match(/<sheet\b[^>]*>/) || [''])[0];
  const rels = (await zip.read('xl/_rels/workbook.xml.rels')) || '';
  const rel = [...rels.matchAll(/<Relationship\b[^>]*>/g)].find((m) => attr(m[0], 'Id') === attr(firstTab, 'r:id'));
  const target = rel && attr(rel[0], 'Target');
  if (target) return target.startsWith('/') ? target.slice(1) : 'xl/' + target;
  return zip.names.filter((n) => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
}

const columnIndex = (letters) => [...letters].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;

/** Rows of text cells from the first tab of an .xlsx file. Dates come back as 'YYYY-MM-DD'. */
async function readXlsx(buffer) {
  const zip = unzip(buffer);
  const workbook = (await zip.read('xl/workbook.xml')) || '';
  const shared = [...((await zip.read('xl/sharedStrings.xml')) || '').matchAll(/<si>([\s\S]*?)<\/si>/g)].map((m) =>
    textRuns(m[1]),
  );
  const isDateStyle = dateStyles(await zip.read('xl/styles.xml'));
  /* Workbooks made on older Macs count days from 1904, 1,462 days after the usual start. */
  const epochShift = /date1904="(1|true)"/.test(workbook) ? 1462 : 0;
  const sheet = await zip.read(await firstSheetPath(zip, workbook));
  if (!sheet) throw new Error('No worksheet found.');

  const rows = [];
  for (const [, rowXml] of sheet.matchAll(/<row[^>]*>([\s\S]*?)<\/row>/g)) {
    const row = [];
    for (const [, attrs, body = ''] of rowXml.matchAll(/<c ([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
      const ref = attr(attrs, 'r');
      const type = attr(attrs, 't');
      const raw = (body.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
      let value = '';
      if (type === 's') value = shared[+raw] || '';
      else if (type === 'inlineStr') value = textRuns(body);
      else if (raw != null) {
        value = xmlText(raw);
        if (!type && isDateStyle[+attr(attrs, 's') || 0]) value = excelDate(+value + epochShift) || value;
      }
      const col = ref ? columnIndex(ref.replace(/\d+$/, '')) : row.length;
      while (row.length < col) row.push('');
      row[col] = value;
    }
    if (row.some((c) => c.trim())) rows.push(row);
  }
  const width = Math.max(0, ...rows.map((r) => r.length));
  return rows.map((r) => r.concat(Array(width - r.length).fill('')));
}

/* state.js: what the page remembers, and the helpers every screen uses.

   The page runs in one of two modes. 'demo' is a fictional shop on a fixed date; 'live' is the shop's own
   jobs on today's date. Each mode saves to its own localStorage key and never touches the other.

   st, the saved state:
     added      jobs entered or imported here
     ev         { jobId: [events logged here] }, kept apart from the job so the demo's own jobs stay read-only
     exp        { jobId: expedite } added after the job was entered
     credit     { jobId: 'requested' | 'credited' }
     contacts   { processor: email address }
     removed    ids of removed jobs, so a removal reaches every computer on a shared file
     handled    { jobId: note } for the "Handled today" list; cleared each morning (handledOn)
     shop, signer, assume, settingsAt   the Setup screen
     view, started, lastImport, setupDone

   Everything that comes from outside the running page (localStorage, a backup, the shared file) passes
   through cleanState() first. Screens build HTML from st, so nothing reaches them that was not checked. */

const STATUS = {
  xmiss: ['Expedite missed', 'red'],
  late: ['Past due', 'red'],
  xrisk: ['Expedite at risk', 'amber'],
  dnc: ['Delivered, not confirmed', 'amber'],
  chk: ['No delivery logged', 'amber'],
  due2: ['Due in 2 days, no ship notice', 'amber'],
  mid: ['Midpoint check due', 'blue'],
  transit: ['In transit to processor', 'gray'],
  ontrack: ['On track', 'gray'],
  newdate: ['New date given', 'amber'],
  shipped: ['Shipped back', 'gray'],
  back: ['Received back', 'gray'],
};
const URGENCY = Object.keys(STATUS);
const OUTCOME_LABEL = { rework: 'Needs rework', reject: 'Rejected or scrapped' };
const EVENT_STEPS = ['sent', 'delivered', ...PROC_STEPS, 'back', 'newdate', 'ask'];
const MONTHS = [
  'January',
  'February',
  'March',
  'April',
  'May',
  'June',
  'July',
  'August',
  'September',
  'October',
  'November',
  'December',
];

const MODE_KEY = 'osp-watch-mode';
const STATE_KEY = { demo: 'osp-watch-demo-v1', live: 'osp-watch-live-v1' };
const UNREADABLE_KEY = 'osp-watch-unreadable';

/* ---------- small helpers ---------- */

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => [...document.querySelectorAll(selector)];

/* html`...` builds markup. Every interpolated value is escaped unless it is itself markup (the result of
   another html`...`, or a list of them), so text from a spreadsheet or a shared file cannot become a tag. */
class Markup {
  constructor(text) {
    this.text = text;
  }
  toString() {
    return this.text;
  }
}
const escapeHtml = (s) =>
  String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function toMarkup(value) {
  if (value == null || value === false) return '';
  if (value instanceof Markup) return value.text;
  if (Array.isArray(value)) return value.map(toMarkup).join('');
  return escapeHtml(value);
}
function html(strings, ...values) {
  return new Markup(strings.reduce((out, s, i) => out + toMarkup(values[i - 1]) + s));
}
/** Markup written in this source, such as an icon path. Never called with data. */
const trusted = (text) => new Markup(text);

const pad = (n) => String(n).padStart(2, '0');
const money = (n) => `$${Math.round(n).toLocaleString('en-US')}`;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const chip = (k) => html`<span class="chip t-${STATUS[k][1]}">${STATUS[k][0]}</span>`;
const jobNo = (j) => j.jn || j.id;
const monthName = () => MONTHS[+T.slice(5, 7) - 1];

function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function now() {
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/** localStorage can be blocked or full. Reads return null and writes return false when it is. */
const store = {
  get(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch {
      return false;
    }
  },
  remove(key) {
    try {
      localStorage.removeItem(key);
    } catch {
      /* nothing to remove if storage is blocked */
    }
  },
};

/* ---------- checking state that comes from outside ---------- */

/* Maps keyed by a job number or a processor name have no prototype, so a processor called "constructor"
   is an ordinary key. */
const emptyMap = () => Object.create(null);
function cleanMap(raw, cleanValue) {
  const out = emptyMap();
  if (raw && typeof raw === 'object')
    for (const [key, value] of Object.entries(raw)) {
      const v = cleanValue(value);
      if (v != null && v !== '') out[key] = v;
    }
  return out;
}
const cleanText = (v, max = 200) => (v == null ? '' : String(v).slice(0, max));
const cleanDay = (v) => (typeof v === 'string' && isDate(v) ? v : null);
const cleanCount = (v) => Math.max(0, Math.floor(Number(v)) || 0);

function cleanEvent(e) {
  if (!e || !EVENT_STEPS.includes(e.m) || !cleanDay(e.d)) return null;
  const out = { m: e.m, d: e.d };
  if (/^\d{2}:\d{2}$/.test(e.t)) out.t = e.t;
  if (e.m === 'newdate') {
    if (!cleanDay(e.to)) return null;
    out.to = e.to;
  }
  if (e.m === 'ask') out.what = cleanText(e.what, 80);
  if (e.m === 'shipped' && e.trk) out.trk = cleanText(e.trk, 60);
  if (e.m === 'back' && OUTCOME_LABEL[e.outcome]) {
    out.outcome = e.outcome;
    out.pcs = cleanCount(e.pcs);
  }
  return out;
}
const cleanEvents = (list) => (Array.isArray(list) ? list.map(cleanEvent).filter(Boolean) : []);
function cleanExpedite(x) {
  if (!x || !(Number(x.fee) > 0) || !cleanDay(x.bought) || !cleanDay(x.by)) return null;
  return { fee: Number(x.fee), bought: x.bought, by: x.by };
}
function cleanJob(j) {
  if (!j || !cleanText(j.id) || !cleanText(j.proc) || !cleanDay(j.sent) || !cleanDay(j.due)) return null;
  const out = {
    id: cleanText(j.id, 60),
    po: cleanText(j.po, 60),
    proc: cleanText(j.proc, 120),
    process: cleanText(j.process, 120) || 'Outside process',
    q: Math.max(1, cleanCount(j.q) || dayNum(j.due) - dayNum(j.sent)),
    qty: cleanCount(j.qty),
    sent: j.sent,
    due: j.due,
    carrier: cleanText(j.carrier, 60),
    trk: cleanText(j.trk, 60),
    ev: cleanEvents(j.ev),
    open: !!j.open,
    exp: cleanExpedite(j.exp),
  };
  if (j.jn) out.jn = cleanText(j.jn, 60);
  if (j.pre) out.pre = true;
  if (Number(j.upd) > 0) out.upd = Number(j.upd);
  return out;
}

function blankState() {
  return {
    added: [],
    ev: emptyMap(),
    exp: emptyMap(),
    credit: emptyMap(),
    contacts: emptyMap(),
    removed: [],
    handled: emptyMap(),
    handledOn: T,
    view: 'today',
    shop: MODE === 'live' ? '' : DATA.shop,
    signer: 'Purchasing',
    assume: { ...DATA.assume },
    settingsAt: 0,
  };
}

/** A state object rebuilt field by field from untrusted input. Anything unknown or malformed is dropped. */
function cleanState(raw) {
  const s = blankState();
  if (!raw || typeof raw !== 'object') return s;
  s.added = (Array.isArray(raw.added) ? raw.added : []).map(cleanJob).filter(Boolean);
  s.ev = cleanMap(raw.ev, (list) => (cleanEvents(list).length ? cleanEvents(list) : null));
  s.exp = cleanMap(raw.exp, cleanExpedite);
  s.credit = cleanMap(raw.credit, (v) => (v === 'requested' || v === 'credited' ? v : null));
  s.contacts = cleanMap(raw.contacts, (v) => cleanText(v, 200).trim());
  s.removed = (Array.isArray(raw.removed) ? raw.removed : []).map((id) => cleanText(id, 60)).filter(Boolean);
  s.handled = cleanMap(raw.handled, (v) => cleanText(v, 120));
  s.handledOn = cleanDay(raw.handledOn) || T;
  if (typeof raw.view === 'string') s.view = raw.view;
  if (typeof raw.shop === 'string') s.shop = cleanText(raw.shop, 80);
  if (typeof raw.signer === 'string') s.signer = cleanText(raw.signer, 80);
  for (const key of Object.keys(s.assume)) {
    const n = Number(raw.assume && raw.assume[key]);
    if (n > 0) s.assume[key] = n;
  }
  s.settingsAt = Number(raw.settingsAt) || 0;
  if (cleanDay(raw.started)) s.started = raw.started;
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(raw.lastImport)) s.lastImport = raw.lastImport;
  if (raw.setupDone) s.setupDone = true;
  return s;
}

/* ---------- the saved state ---------- */

let MODE = store.get(MODE_KEY) === 'live' ? 'live' : 'demo';
let T = MODE === 'live' ? localToday() : DATA.today;
let st = loadState();
let undoState = null;
let saveWarned = false;

/* What a screen is showing that is not worth saving. */
let todayFilter = '';
let jobFilter = newJobFilter();
let showAllExpedites = false;
let pendingImport = null;

function newJobFilter() {
  return { proc: '', process: '', status: '', q: '', closed: false };
}

function loadState() {
  const text = store.get(STATE_KEY[MODE]);
  let raw = null;
  if (text) {
    try {
      raw = JSON.parse(text);
    } catch {
      /* Keep what could not be read, so the next save does not destroy it. */
      store.set(UNREADABLE_KEY, text);
    }
  }
  const s = cleanState(raw);
  if (s.handledOn !== T) {
    s.handled = emptyMap();
    s.handledOn = T;
  }
  return s;
}

function save() {
  const saved = store.set(STATE_KEY[MODE], JSON.stringify(st));
  if (!saved && !saveWarned) {
    saveWarned = true;
    toast('This browser would not save. Back up from Setup before you close the page.');
  }
  if (MODE === 'live') queueFileSync();
}

/** Remember the state as it is now, so the next toast can offer Undo. */
function snap() {
  undoState = JSON.stringify(st);
}
function undo() {
  if (!undoState) return;
  st = cleanState(JSON.parse(undoState));
  undoState = null;
  save();
  render();
  toast('Undone.');
}

function setMode(mode) {
  MODE = mode;
  store.set(MODE_KEY, mode);
  T = MODE === 'live' ? localToday() : DATA.today;
  st = loadState();
  undoState = null;
  resetScreens();
  render();
}
function resetScreens() {
  todayFilter = '';
  showAllExpedites = false;
  pendingImport = null;
  jobFilter = newJobFilter();
  closePanel();
  selectFirst = true;
}

function settingsChanged() {
  st.settingsAt = Date.now();
  save();
}

/* ---------- reading the state ---------- */

/** Every job, with what was logged here folded in. Screens read this, never st.added. */
function jobs() {
  const all = MODE === 'demo' ? DATA.jobs.concat(st.added) : st.added;
  return all.map((j) => {
    const events = st.ev[j.id];
    const exp = st.exp[j.id];
    if (!events && !exp) return j;
    return { ...j, ev: events ? j.ev.concat(events) : j.ev, exp: exp || j.exp };
  });
}
const job = (id) => jobs().find((j) => j.id === id);
const isOpen = (j) => j.open && !isBack(j);
const shopName = () => st.shop || 'Your shop';
const signature = () => (st.signer || 'Purchasing') + (st.shop ? `, ${st.shop}` : '');
const contactFor = (proc) => st.contacts[proc] || (MODE === 'demo' && DATA.contacts[proc]) || '';

function logEvent(id, event) {
  (st.ev[id] = st.ev[id] || []).push({ d: T, t: now(), ...event });
  save();
}

/** The carrier's own tracking page, for UPS and FedEx. */
function trackUrl(j) {
  const n = (j.trk || '').trim();
  if (!n || /^DEMO/i.test(n)) return '';
  if (/ups/i.test(j.carrier)) return `https://www.ups.com/track?tracknum=${encodeURIComponent(n)}`;
  if (/fedex/i.test(j.carrier)) return `https://www.fedex.com/fedextrack/?trknbr=${encodeURIComponent(n)}`;
  return '';
}

/** Why a job is on Today, in a sentence. */
function reason(j, s) {
  const heard = s.lastAns ? `Last heard: ${STEP_LABEL[s.lastAns.m].toLowerCase()}, ${fmtDate(s.lastAns.d)}.` : '';
  switch (s.k) {
    case 'dnc': {
      const d = last(j, ['delivered']);
      const who = OWN_DELIVERY.test(j.carrier) ? 'Our driver dropped off' : `${j.carrier || 'The carrier'} delivered`;
      return `${who} ${relDay(d.d, T)}${d.t ? ` at ${fmtTime(d.t)}` : ''}. No word from the processor yet.`;
    }
    case 'chk':
      return `Sent ${relDay(j.sent, T)}${j.carrier ? ` by ${j.carrier}` : ''}. No delivery logged. Check the tracking, then mark it delivered, or ask the processor.`;
    case 'mid':
      return `Halfway through a${/^(8|11|18)/.test(j.q) ? 'n' : ''} ${j.q}-day turn. ${heard}`;
    case 'due2':
      return `Due back ${relDay(s.due, T)}. No ship notice. ${heard}`;
    case 'late':
      return `${plural(dayNum(T) - dayNum(s.due), 'day')} past due. ${heard}`;
    case 'xrisk':
      return `${money(j.exp.fee)} expedite to be back ${relDay(j.exp.by, T)}. ${heard}`;
    case 'xmiss':
      return `${money(j.exp.fee)} expedite was for ${fmtDate(j.exp.by)}. Not shipped.`;
    default:
      return '';
  }
}

/* ---------- toast ---------- */

let toastTimer = null;
function toast(message, offerUndo) {
  const el = $('#toast');
  el.textContent = message;
  if (offerUndo && undoState) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Undo';
    b.onclick = undo;
    el.appendChild(b);
  }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), offerUndo ? 6000 : 2400);
}

/* ---------- events ---------- */

/** Run fn(element, event) for an event that starts inside something matching selector. Screens are redrawn
    as strings, so listeners live on the document and survive every redraw. */
function on(type, selector, fn) {
  document.addEventListener(type, (e) => {
    const el = e.target instanceof Element && e.target.closest(selector);
    if (el) fn(el, e);
  });
}

/* render.js: the frame around every screen (navigation, top bar, status bar, banner) and the redraw.

   A change follows one path: a handler updates st, calls save(), then render(), which redraws the current
   screen from scratch. Each screen is a function of the job list that returns markup. */

const SCREENS = [
  { id: 'today', label: 'Today', draw: vToday },
  { id: 'jobs', label: 'Jobs at processors', draw: vJobs },
  { id: 'exp', label: 'Expedites', draw: vExp },
  { id: 'procs', label: 'Processors', draw: vProcs },
  { id: 'imp', label: 'Import', draw: vImport },
  { id: 'sum', label: 'Monthly summary', draw: vSum },
  { id: 'set', label: 'Setup', draw: vSetup },
  { id: 'it', label: 'For your IT', draw: vIT },
];
const DEMO_BANNER = $('#bmode').textContent;
const DEMO_NOTE = $('#bnote').textContent;
let drawnScreen = null;
/* Set when a screen is opened afresh, so Today starts with its first job in the reading pane. */
let selectFirst = true;

function navButton(screen, badge) {
  return html`<button type="button" data-v="${screen.id}" aria-current="${st.view === screen.id ? 'page' : 'false'}">
    <span class="lbl">${screen.label}</span>${badge}
  </button>`;
}

function render() {
  const J = jobs();
  const open = J.filter(isOpen);
  const needWord = open.filter((j) => statusOf(j, T).action).length;
  const expedites = ledger(J, T);
  const uncredited = expedites.filter((x) => x.res === 'missed' && x.back && !st.credit[x.id]).length;
  const badges = {
    today: needWord ? html`<span class="badge">${needWord}</span>` : '',
    jobs: html`<span class="badge n">${open.length}</span>`,
    exp: uncredited ? html`<span class="badge">${uncredited}</span>` : '',
  };
  const screen = SCREENS.find((s) => s.id === st.view) || SCREENS[0];

  /* Redrawing replaces the buttons, so keyboard focus on the navigation is put back afterwards. */
  const focusedNav = document.activeElement && document.activeElement.closest('#navlist [data-v]');
  $('#navlist').innerHTML = html`${SCREENS.map((s) => navButton(s, badges[s.id]))}`;
  $('#view').innerHTML = screen.draw(J);
  if (focusedNav) $(`#navlist [data-v="${focusedNav.dataset.v}"]`).focus();
  if (drawnScreen !== screen.id) $('#view').scrollTop = 0;
  drawnScreen = screen.id;

  document.body.classList.toggle('pane', paneFits());
  const firstRow = $('#view .msgs tr[data-job]');
  if (selectFirst && isDocked() && !panel && firstRow) openJob(firstRow.dataset.job);
  selectFirst = false;
  markSelectedRow();
  if (document.activeElement !== $('#gsearch')) $('#gsearch').value = st.view === 'jobs' ? jobFilter.q : '';

  const monthStart = T.slice(0, 8) + '01';
  const thisMonth = expedites.filter((x) => x.bought >= monthStart);
  const fees = thisMonth.reduce((a, x) => a + x.fee, 0);
  $('#shopname').textContent = shopName();
  $('#clock').textContent = `${fmtDay(T)}, ${T.slice(0, 4)}`;
  $('#tb_open').textContent = open.length;
  $('#tb_acts').textContent = needWord;
  $('#tb_exp').textContent = `${money(fees)} · ${thisMonth.filter((x) => x.res === 'missed').length} missed`;
  $('#tb_impc').hidden = MODE !== 'live';
  $('#tb_imp').textContent = st.lastImport
    ? `${fmtDate(st.lastImport.slice(0, 10))}, ${fmtTime(st.lastImport.slice(11))}`
    : 'none yet';
  showFileStatus();

  const live = MODE === 'live';
  $('#bmode').textContent = live ? 'Early version · your own jobs' : DEMO_BANNER;
  $('#bnote').textContent = live
    ? 'Saved in this browser, and in your shared file if you connect one in Setup. Nothing is uploaded; emails go from your own mailbox.'
    : DEMO_NOTE;
  $('#bswitch').textContent = live ? 'See the demo' : 'Use my own jobs';
  $('#reset').textContent = live ? 'Download backup' : 'Reset demo';
}

function show(view) {
  st.view = view;
  save();
  closePanel();
  selectFirst = true;
  render();
}
on('click', '[data-v]', (el) => show(el.dataset.v));
on('click', '[data-print]', () => window.print());

/* ---------- pieces several screens share ---------- */

function pageHead(title, subtitle, actions) {
  return html`<div class="head">
    <div>
      <h1>${title}</h1>
      <p>${subtitle}</p>
    </div>
    ${actions && html`<span class="sp"></span>${actions}`}

}
function tile(figure, label, note, tone) {
  return html`<div class="tile static">
    <div class="n ${tone}">${figure}</div>
    <div class="l">${label}</div>
    ${note && html`<div class="s">${note}</div>`}

}
const DASH = html`<span class="muted">—</span>`;

/* today.js: the morning list. Every open job that needs a word with a processor, most urgent first. */

const TODAY_GROUPS = [
  { id: 'x', label: 'Expedites', kinds: ['xmiss', 'xrisk'] },
  { id: 'late', label: 'Past due', kinds: ['late'] },
  { id: 'dnc', label: 'Not confirmed', kinds: ['dnc', 'chk'] },
  { id: 'due2', label: 'No ship notice', kinds: ['due2'] },
  { id: 'mid', label: 'Midpoint', kinds: ['mid'] },
];
const byUrgency = ([, a], [, b]) => URGENCY.indexOf(a.k) - URGENCY.indexOf(b.k) || (a.due < b.due ? -1 : 1);

function todayRow([j, s]) {

/* The tabs above the list: every job, then one tab per reason. */
function todayTab(id, label, count) {

  return html`<button

function handledRow([j, note]) {

/* The printed call sheet: the same list grouped by processor, with blank columns for the answers. It is
   in the page all the time and shown only when printing. */
function callSheet(rows, group) {
  const byProc = new Map();
  for (const row of rows) byProc.set(row[0].proc, [...(byProc.get(row[0].proc) || []), row]);

/* A first-day checklist, shown in live mode until it is hidden. */
function setupCard(J) {
