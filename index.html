function vToday(J) {
  const rows = J.filter((j) => j.open)
    .map((j) => [j, statusOf(j, T)])
    .filter(([, s]) => s.action)
    .sort(byUrgency);
  const group = TODAY_GROUPS.find((g) => g.id === todayFilter);
  const shown = group ? rows.filter(([, s]) => group.kinds.includes(s.k)) : rows;
  const handled = Object.entries(st.handled)
    .map(([id, note]) => [job(id), note])
    .filter(([j]) => j);
  const openCount = J.filter(isOpen).length;
  const headline = rows.length
    ? `${rows.length} job${rows.length === 1 ? ' needs' : 's need'} a word with a processor this morning.`
    : openCount
      ? `Nothing needs a word with a processor. All ${plural(openCount, 'open job')} checked against today's date.`
      : 'No jobs out yet.';

  return html`<div class="scr inbox">
      ${pageHead(
        'Today',
        `${fmtDay(T)} · ${headline}`,
        rows.length > 0 && html`<button type="button" class="btn" data-print>Print call sheet</button>`,
      )}
      ${setupCard(J)}
      ${rows.length > 0 &&
      html`<div class="tiles">
        ${todayTab('', 'All', rows.length)}
        ${TODAY_GROUPS.map((g) => todayTab(g.id, g.label, rows.filter(([, s]) => g.kinds.includes(s.k)).length))}
      </div>`}
      <div class="card">
        <h2>Action list</h2>
        ${shown.length
          ? html`<table class="msgs">
              <thead>
                <tr>
                  <th>Processor</th>
                  <th>Job</th>
                  <th>What it needs</th>
                  <th>Due back</th>
                </tr>
              </thead>
              <tbody>
                ${shown.map(todayRow)}
              </tbody>
            </table>`
          : html`<div class="empty">${rows.length ? 'Nothing in this group.' : 'Nothing to follow up today.'}</div>`}
      </div>
      ${handled.length > 0 &&
      html`<div class="card">
        <h2>Handled today <span>· ${handled.length}</span></h2>
        <table>
          <tbody>
            ${handled.map(handledRow)}
          </tbody>
        </table>
      </div>`}
      <p class="small">
        Delivery times come from the carrier's tracking page or your driver's drop-off; in this early version you mark
        them, they are not looked up automatically. Jobs your own driver drops off count as delivered the day they go
        out. Every check asks the processor for a physical step, not "are we on track?".
      </p>
    </div>
    ${callSheet(shown, group)}`;
}

/* panel.js: the side panel, and the email draft shown in it.

   On Today, on a wide screen, the panel is docked beside the list as a reading pane (body.pane). On every
   other screen it opens over the page as a dialog. */

/* What the panel is showing: { kind: 'draft' | 'job' | 'add', id, ... }, or null when it is closed. */
let panel = null;
let panelOpener = null;

const paneFits = () => st.view === 'today' && innerWidth >= 1100;
const isDocked = () => document.body.classList.contains('pane');

function markSelectedRow() {
  const id = panel && panel.id;
  for (const row of $$('#view tr[data-job]')) row.classList.toggle('sel', row.dataset.job === id);
}

function openPanel(showing, markup) {
  const el = $('#panel');
  if (!panel) panelOpener = document.activeElement;
  panel = showing;
  el.innerHTML = markup;
  el.classList.add('on');
  el.setAttribute('aria-hidden', 'false');
  $('#scrim').classList.add('on');
  markSelectedRow();
  /* As a dialog it takes the keyboard. Docked, it leaves focus in the list so the arrow keys keep working. */
  if (!isDocked()) el.focus();
}

function closePanel() {
  if (!panel) return;
  panel = null;
  $('#panel').classList.remove('on');
  $('#panel').setAttribute('aria-hidden', 'true');
  $('#scrim').classList.remove('on');
  markSelectedRow();
  if (panelOpener && panelOpener.isConnected) panelOpener.focus();
  panelOpener = null;
}

function panelHeader(title, subtitle, chips) {
  return html`<header>
    <div>
      <h3 id="panel-title">${title}</h3>
      <div class="small">${subtitle}</div>
      ${chips && html`<div class="chips">${chips}</div>`}
    </div>
    <button class="x" type="button" data-close aria-label="Close">×</button>
  </header>`;
}

addEventListener('resize', () => document.body.classList.toggle('pane', paneFits()));
on('click', '#scrim, [data-close]', closePanel);
document.addEventListener('keydown', (e) => {

});

/* ---------- the email draft ---------- */

/* Other jobs at the same processor that also need a word today and have not been asked yet. With two or
   more, the panel offers one email covering all of them. */
function sameProcessorToday(j) {
  return jobs()
    .filter((g) => isOpen(g) && g.proc === j.proc)
    .map((g) => [g, statusOf(g, T)])
    .filter(([g, s]) => s.action && (g.id === j.id || !s.asked));
}

function replyPicker() {
  return html`<div class="pick" id="pick" hidden>
    <b>What did they say?</b>
    <span class="small">Click the step they confirmed, or paste their reply and it is picked out for you.</span>

          html`<button type="button" class="btn sm" data-step="${m}">

function openDraft(id, { credit = false, showReply = false } = {}) {
  const j = job(id);
  const s = statusOf(j, T);
  const draft = credit ? creditDraft(j, T, signature()) : draftFor(j, s, T, signature());
  const group = credit || !s.action ? [] : sameProcessorToday(j);
  const creditState = st.credit[id];

  openPanel(
    { kind: 'draft', id, credit, proc: j.proc, group, sendTo: [id], logged: false },
    html`${panelHeader(
        `${credit ? 'Credit request' : 'Draft email'} · Job ${jobNo(j)}`,
        `${j.proc} · ${j.process}${j.qty > 0 ? ` · ${j.qty} pcs` : ''}`,
        credit ? html`<span class="chip t-red">Expedite missed</span>` : chip(s.k),
      )}
      ${group.length > 1 &&
      html`<div class="note inset" id="grpnote">
        <b>${j.proc} has ${group.length} jobs on today's list.</b>
        <button type="button" class="btn sm" id="dgrp">One email for all ${group.length}</button>
      </div>`}
      <div class="body">
        <div class="field">
          <label for="dto">To</label>
          <input
            type="text"
            id="dto"
            placeholder="Processor's email (remembered for next time)"
            value="${contactFor(j.proc)}"
          />
        </div>
        <div class="field">
          <label for="dsub">Subject</label><input type="text" id="dsub" value="${draft.subject}" />
        </div>
        <div class="field">
          <label for="dbody">Message</label><textarea id="dbody" rows="11">${draft.body}</textarea>
        </div>
        <div class="note">
          Edit anything. It goes from your own mailbox, so the processor sees a normal email from you. Nothing is sent
          from here.

        ${!credit && replyPicker()}
      </div>
      <div class="foot">
        <a class="btn pri" id="dmail" href="#">Open in Outlook</a>
        <button type="button" class="btn" id="dcopy">Copy</button>
        <span class="grow"></span>
        ${credit
          ? html`<button type="button" class="btn" id="dcred">
              ${creditState === 'requested' ? 'Mark credit received' : 'Mark credit requested'}
            </button>`
          : html`<button type="button" class="btn" id="dans">Log their answer</button>`}
      </div>`,
  );
  if (showReply) $('#pick').hidden = false;

}

function refreshMailLink() {
  $('#dmail').href = mailto($('#dto').value, { subject: $('#dsub').value, body: $('#dbody').value });
}
on('input', '#dto, #dsub, #dbody', refreshMailLink);

const EMAIL_LIST = /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+([,;] ?[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+)*$/;
function rememberContact() {
  const to = $('#dto').value.trim();
  if (!EMAIL_LIST.test(to) || to === contactFor(panel.proc)) return;
  st.contacts[panel.proc] = to;
  settingsChanged();
}
on('change', '#dto', rememberContact);

on('click', '#dgrp', () => {
  const all = draftForProc(panel.group, T, signature());
  $('#dsub').value = all.subject;
  $('#dbody').value = all.body;
  panel.sendTo = panel.group.map(([j]) => j.id);
  refreshMailLink();
  $('#grpnote').innerHTML = html`<b>One email covering jobs ${panel.group.map(([j]) => jobNo(j)).join(', ')}.</b>
    Sending it marks all of them as asked. Log each answer on its own job.`;
});

/* Copying or opening the draft is as close as the page gets to knowing it was sent, so that is when the
   job is marked as asked. Once per draft, however many times the buttons are pressed. */
function markAsked(how) {
  rememberContact();
  if (panel.logged) return;
  panel.logged = true;
  if (panel.credit) {
    if (!st.credit[panel.id]) st.credit[panel.id] = 'requested';
    save();
  } else {
    for (const id of panel.sendTo) logEvent(id, { m: 'ask', what: how });
  }
  render();
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    /* The clipboard API is refused in some settings. The older command still works there. */
    const area = document.createElement('textarea');
    area.value = text;
    document.body.append(area);
    area.select();
    const copied = document.execCommand('copy');
    area.remove();
    return copied;
  }
}
on('click', '#dcopy', async () => {
  const copied = await copyText(`Subject: ${$('#dsub').value}\n\n${$('#dbody').value}`);
  if (!copied) return toast('Could not copy. Select the message and copy it by hand.');
  markAsked('Draft copied');
  toast('Copied. Paste it into a new email.');
});
on('click', '#dmail', () => {
  markAsked('Opened in Outlook');
  toast('Opening your mail app with the draft filled in.');
});

on('click', '#dcred', () => {
  const { id } = panel;
  const j = job(id);
  snap();
  st.credit[id] = st.credit[id] === 'requested' ? 'credited' : 'requested';
  save();
  closePanel();
  render();
  toast(`${st.credit[id] === 'credited' ? 'Marked credited' : 'Credit request logged'}: Job ${jobNo(j)}`, true);
});

  const pick = $('#pick');

  const reply = parseReply(el.value, T);

  const found = [
    reply.m && STEP_LABEL[reply.m],

    reply.date && `date given: ${fmtDay(reply.date)}`,
  ].filter(Boolean);
  const note = $('#rpn');
  note.hidden = !el.value.trim();
  note.innerHTML = found.length
    ? html`Reads as: <b>${found.join(' · ')}</b>. Check it, then click
        ${reply.m ? 'the highlighted step' : '"Save new date"'}.`
    : html`Could not pick a step out of that. Click the one they confirmed.`;
});

on('click', '#panel [data-step]', (el) => {
  const { id } = panel;
  const step = el.dataset.step;
  const j = job(id);
  const before = statusOf(j, T);
  const newDate = $('#nd').value;
  if (step === 'newdate' && (!newDate || newDate < T)) {
    $('#nd').focus();
    return toast('Pick the new date first.');
  }
  snap();
  if (step === 'newdate') logEvent(id, { m: 'newdate', to: newDate });
  else {
    logEvent(id, step === 'shipped' ? { m: step, trk: $('#trk').value.trim() || 'No tracking given' } : { m: step });
    /* A date typed alongside a step is a new date too, unless the job has shipped or the date is unchanged. */
    if (step !== 'shipped' && newDate > T && newDate !== before.due) logEvent(id, { m: 'newdate', to: newDate });
  }
  const said = step === 'newdate' ? `New date ${fmtDate(newDate)}` : STEP_LABEL[step];
  noteHandled(id, before, said);
  closePanel();
  render();
  toast(`Job ${jobNo(j)} updated: ${said.toLowerCase()}`, true);
});

/** Put a job on the "Handled today" list if it was on the action list before the change. */
function noteHandled(id, before, what) {
  if (!before.action) return;
  st.handled[id] = `${what} (was: ${STATUS[before.k][0].toLowerCase()})`;
  save();
}

function markDelivered(id) {
  const j = job(id);
  const before = statusOf(j, T);
  snap();
  logEvent(id, { m: 'delivered' });
  noteHandled(id, before, 'Delivered');
  closePanel();
  render();
  toast(`Job ${jobNo(j)}: delivered. It now waits for the processor to confirm.`, true);
}

on('click', '[data-credit]', (el) => openDraft(el.dataset.credit, { credit: true }));

/* job.js: one job in the side panel (its timeline and what can be done to it), and the form that adds or
   edits a job. */

const ROUTE = ['sent', 'delivered', ...PROC_STEPS, 'back'];

/* ---------- the timeline ---------- */

function routeStep(j, step, index, lastReported) {
  /* Receipt is shown at the date it was first confirmed; every other step at its latest report. */
  const e = step === 'received' ? j.ev.find((x) => x.m === 'received') : last(j, [step]);
  const state = !e ? 'todo' : index === lastReported ? 'now' : 'done';
  const tracking = trackUrl(j)
    ? html`<a target="_blank" rel="noopener noreferrer" href="${trackUrl(j)}">${j.trk}</a>`
    : j.trk;
  let detail = '';
  if (!e) detail = index < lastReported ? ' · not reported' : '';
  else if (step === 'sent') detail = html` · ${j.carrier} ${tracking}`;
  else if (step === 'delivered') detail = ` · ${j.carrier}${e.t ? `, ${fmtTime(e.t)}` : ''}`;
  else if (step === 'shipped' && e.trk) detail = ` · ${e.trk}`;
  const problem = e && e.outcome && `· ${OUTCOME_LABEL[e.outcome].toLowerCase()}${e.pcs ? `, ${e.pcs} pcs` : ''}`;
  return html`<li class="${state}">
    <div>${STEP_LABEL[step]} ${problem && html`<span class="bad">${problem}</span>`}</div>
    <div class="w">${e && fmtDay(e.d)}${detail}</div>
  </li>`;
}

function activityLine(e) {
  return html`<li>
    <div>${e.m === 'ask' ? `We asked: ${e.what || 'check'}` : `New date given: ${fmtDay(e.to)}`}</div>
    <div class="w">${fmtDay(e.d)}${e.t && `, ${fmtTime(e.t)}`}</div>
  </li>`;
}

function openJob(id) {
  const j = job(id);
  const s = statusOf(j, T);
  const open = isOpen(j);
  const lastReported = ROUTE.reduce((at, step, i) => (j.ev.some((e) => e.m === step) ? i : at), -1);
  const activity = j.ev.filter((e) => e.m === 'ask' || e.m === 'newdate');
  const expedite = j.exp && ledger([j], T)[0];
  const enteredHere = st.added.some((a) => a.id === id);
  const awaitingDelivery = open && !last(j, ['delivered']) && !j.ev.some((e) => PROC_STEPS.includes(e.m));

  openPanel(
    { kind: 'job', id },
    html`${panelHeader(
        `Job ${jobNo(j)} · ${j.process}`,
        `${j.proc}${j.qty > 0 ? ` · ${j.qty} pcs` : ''}${j.po ? ` · ${j.po}` : ''}`,
        chip(s.k),
      )}
      <div class="body">
        <div class="kv">
          <div>Sent</div>
          <div>${fmtDay(j.sent)}</div>
          <div>Quoted turn</div>
          <div>${j.q} days</div>
          <div>Due back</div>
          <div>${fmtDay(j.due)}${s.due !== j.due && html` → <b>${fmtDay(s.due)}</b> (new date)`}</div>
          ${open &&
          s.k !== 'shipped' &&
          html`<div>Midpoint check</div>
            <div>${fmtDay(midDate(j))}</div>`}
        </div>
        <b>Progress at processor</b>
        <ul class="tl">
          ${ROUTE.map((step, i) => routeStep(j, step, i, lastReported))}
        </ul>
        ${activity.length > 0 &&
        html`<b>Activity</b>
          <ul class="tl log">
            ${activity.map(activityLine)}
          </ul>`}
        ${expedite &&
        html`<div class="box">
          <b>Expedite</b>
          <div class="kv">
            <div>Fee</div>
            <div>${money(expedite.fee)}, paid ${fmtDay(expedite.bought)}</div>
            <div>Promised by</div>
            <div>${fmtDay(expedite.by)}</div>
            <div>Result</div>
            <div>${resultChip(expedite)}</div>
          </div>
        </div>`}
        ${open &&
        !j.exp &&
        html`<div class="box">
          <b>Paid an expedite on this job?</b>
          <div class="row">
            <input
              type="text"
              id="xfee"
              class="short"
              inputmode="decimal"
              aria-label="Expedite fee in dollars"
              placeholder="Fee, $"
            />
            <label class="small" for="xby">to be back by</label>
            <input type="date" id="xby" />
            <button type="button" class="btn sm" id="xadd">Add expedite</button>
          </div>
        </div>`}
        ${enteredHere &&
        html`<p class="small">
          <button type="button" class="link" id="jed">Edit this job</button> (fix a date, quantity or processor) ·
          <button type="button" class="link" id="jrm">Remove it</button>
        </p>`}
      </div>
      <div class="foot" id="jfoot">
        ${s.action && html`<button type="button" class="btn pri" data-draft="${j.id}">Draft email</button>`}
        ${awaitingDelivery && html`<button type="button" class="btn" data-deliv="${j.id}">Mark delivered</button>`}
        ${open && s.k !== 'shipped' && html`<button type="button" class="btn" id="jupd">Log update</button>`}
        ${open &&
        html`<button type="button" class="btn" id="jback">Received back</button>
          <button type="button" class="btn" id="jprob">Received with a problem</button>`}
        ${expedite &&
        expedite.res === 'missed' &&
        expedite.back &&
        html`<button type="button" class="btn" data-credit="${j.id}">Credit request</button>`}
        <span class="grow"></span><button type="button" class="btn closer" data-close>Close</button>
      </div>`,
  );
}

/* ---------- what can be done to a job ---------- */

on('click', '#jupd', () => openDraft(panel.id, { showReply: true }));

function receiveBack(id, outcome, pcs) {
  const j = job(id);
  const before = statusOf(j, T);
  snap();
  logEvent(id, outcome ? { m: 'back', outcome, pcs } : { m: 'back' });
  noteHandled(id, before, outcome ? `Received back, ${OUTCOME_LABEL[outcome].toLowerCase()}` : 'Received back');
  closePanel();
  render();
  toast(
    outcome
      ? `Job ${jobNo(j)} received back: ${pcs ? `${pcs} pcs ` : ''}${OUTCOME_LABEL[outcome].toLowerCase()}. It counts on the processor scorecard.`
      : `Job ${jobNo(j)} received back. Its turn time joins the processor history.`,
    true,
  );
}
on('click', '#jback', () => receiveBack(panel.id));
on('click', '#jprob', () => {
  const j = job(panel.id);
  $('#jfoot').innerHTML = html`<select id="jq" aria-label="What was wrong">
      ${Object.entries(OUTCOME_LABEL).map(([value, label]) => html`<option value="${value}">${label}</option>`)}
    </select>
    <input
      type="text"
      id="jqn"
      class="short"
      inputmode="numeric"

    />

    <button type="button" class="btn pri" id="jqgo">Log it</button>`;
});
on('click', '#jqgo', () => receiveBack(panel.id, $('#jq').value, parseCount($('#jqn').value)));

on('click', '#xadd', () => {
  const { id } = panel;
  const fee = parseMoney($('#xfee').value);
  const by = $('#xby').value;
  if (!(fee > 0) || !by) return toast('Enter the fee and the date it was to be back by.');
  snap();
  st.exp[id] = { fee, bought: T, by };
  save();
  closePanel();
  render();
  toast(`Expedite logged: ${money(fee)} for ${fmtDate(by)}.`, true);
});

on('click', '#jed', () => openJobForm(st.added.find((a) => a.id === panel.id)));
on('click', '#jrm', () => {
  const { id } = panel;
  const j = job(id);
  snap();
  st.removed.push(id);
  st.added = st.added.filter((a) => a.id !== id);
  delete st.ev[id];
  delete st.exp[id];
  delete st.credit[id];
  delete st.handled[id];

/* ---------- adding and editing ---------- */

const parseCount = (text) => parseInt(String(text).replace(/,/g, ''), 10) || 0;
const parseMoney = (text) => parseFloat(String(text).replace(/[$,]/g, '')) || 0;
const quotedTurn = (sent, due) => Math.max(1, dayNum(due) - dayNum(sent));

/** A job from the add form or an import row. */
function newJob(o) {
  if (MODE === 'live' && !st.started) st.started = T;

  /* A second operation on the same job number, or a number that was used and removed, gets a suffix. The
     number as typed is kept in jn for display. A removed id is never reused, because the removal is still
     on record for every computer sharing the file. */
  const taken = new Set([...jobs().map((j) => j.id), ...st.removed]);
  let id = o.job;
  for (let n = 2; taken.has(id); n++) id = `${o.job} #${n}`;

  const carrier = o.carrier || 'Shop driver';
  const ev = [{ m: 'sent', d: o.sent }];
  if (OWN_DELIVERY.test(carrier) && o.sent <= T) ev.push({ m: 'delivered', d: o.sent });
  if (o.back) ev.push({ m: 'back', d: o.back });

  const j = {
    id,
    po: o.po || '',
    proc: o.proc,
    process: o.process || 'Outside process',
    q: quotedTurn(o.sent, o.due),
    qty: o.qty || 0,
    sent: o.sent,
    due: o.due,
    carrier,
    trk: o.trk || '',
    ev,
    open: !o.back,
    exp: o.fee > 0 && o.by ? { fee: o.fee, bought: o.sent, by: o.by } : null,
  };
  if (id !== o.job) j.jn = o.job;
  /* Sent two or more days before the shop started: asking whether it arrived would be noise (see statusOf). */
  if (MODE === 'live' && !o.back && o.sent <= addDays(st.started, -2)) j.pre = true;
  return j;
}

const CARRIERS = ['Shop driver', 'Local courier', 'UPS Ground', 'FedEx Ground', 'Other carrier'];

function openJobForm(editing) {
  const J = jobs();
  const known = (key) => [...new Set(J.map((j) => j[key]).filter(Boolean))].sort();
  const field = (id, label, control) => html`<div class="field"><label for="aj_${id}">${label}</label>${control}</div>`;
  const text = (id, value, extra) => html`<input type="text" id="aj_${id}" value="${value}" ${extra} />`;
  const e = editing || {};
  /* An expedite added from the job panel lives in st.exp and is not edited here. */
  const exp = (e.exp && !st.exp[e.id] && e.exp) || {};
  const carriers = !e.carrier || CARRIERS.includes(e.carrier) ? CARRIERS : [...CARRIERS, e.carrier];

  openPanel(
    { kind: 'form', id: e.id, editing: !!editing },
    html`${panelHeader(
        editing ? `Edit job ${jobNo(editing)}` : 'Add a job',
        editing
          ? 'Fix a date, a quantity or the processor. What the processor has told you is kept.'
          : 'A job you sent out, or are sending today.',
      )}
      <div class="body">
        <div class="grid2">
          ${field('job', 'Job number', text('job', editing ? jobNo(editing) : '', editing && 'disabled'))}
          ${field('po', 'PO (optional)', text('po', e.po || ''))}
        </div>
        ${field(
          'proc',
          'Processor',
          html`<input type="text" id="aj_proc" list="dl_proc" value="${e.proc || ''}" />
            <datalist id="dl_proc">${known('proc').map((v) => html`<option value="${v}"></option>`)}</datalist>`,
        )}
        ${field(
          'process',
          'Process',
          html`<input
              type="text"
              id="aj_process"
              list="dl_process"
              value="${e.process || ''}"
              placeholder="Anodize, heat treat, chem film…"
            />
            <datalist id="dl_process">${known('process').map((v) => html`<option value="${v}"></option>`)}</datalist>`,
        )}
        <div class="grid2">
          ${field('qty', 'Qty', text('qty', e.qty || '', trusted('inputmode="numeric"')))}
          ${field(
            'carrier',
            'Sent by',
            html`<select id="aj_carrier">
              ${carriers.map((c) => html`<option ${c === e.carrier && 'selected'}>${c}</option>`)}
            </select>`,
          )}
        </div>
        ${field('trk', 'Tracking number (if shipped)', text('trk', e.trk || ''))}
        <div class="grid2">
          ${field('sent', 'Date sent', html`<input type="date" id="aj_sent" value="${e.sent || T}" />`)}
          ${field('due', 'Due back', html`<input type="date" id="aj_due" value="${e.due || ''}" />`)}
        </div>
        <div class="grid2">
          ${field('fee', 'Expedite fee, $ (if any)', text('fee', exp.fee || '', trusted('inputmode="decimal"')))}
          ${field('by', 'Expedited to be back by', html`<input type="date" id="aj_by" value="${exp.by || ''}" />`)}
        </div>
      </div>
      <div class="foot end">
        <button type="button" class="btn pri" id="aj_go">${editing ? 'Save changes' : 'Add job'}</button>
        <button type="button" class="btn" data-close>Cancel</button>
      </div>`,
  );
}

function readJobForm() {
  const value = (id) => $('#aj_' + id).value.trim();
  return {
    job: value('job'),
    po: value('po'),
    proc: value('proc'),
    process: value('process'),
    qty: parseCount(value('qty')),
    carrier: value('carrier'),
    trk: value('trk'),
    sent: value('sent'),
    due: value('due'),
    fee: parseMoney(value('fee')),
    by: value('by'),
  };
}

function saveEdit(id, o) {
  const j = st.added.find((a) => a.id === id);
  if (!j) return;
  snap();
  /* The sent and own-driver delivery events move with the sent date. Anything logged with a time stays put. */
  for (const e of j.ev) if ((e.m === 'sent' || e.m === 'delivered') && e.d === j.sent && !e.t) e.d = o.sent;
  if (OWN_DELIVERY.test(o.carrier) && o.sent <= T && !j.ev.some((e) => e.m === 'delivered'))
    j.ev.push({ m: 'delivered', d: o.sent });
  Object.assign(j, {
    po: o.po,
    proc: o.proc,
    process: o.process || 'Outside process',
    qty: o.qty,
    carrier: o.carrier,
    trk: o.trk,
    sent: o.sent,
    due: o.due,
    q: quotedTurn(o.sent, o.due),
    upd: Date.now(),
  });
  if (!st.exp[id])
    j.exp = o.fee > 0 && o.by ? { fee: o.fee, bought: (j.exp && j.exp.bought) || o.sent, by: o.by } : null;
  save();
  closePanel();
  render();
  toast(`Job ${jobNo(j)} updated.`, true);
}

on('click', '#aj_go', () => {
  const o = readJobForm();
  if (!o.job || !o.proc || !o.sent || !o.due) return toast('Job number, processor, date sent and due back are needed.');
  if (o.due < o.sent) return toast('Due back is before the date sent.');
  if (panel.editing) return saveEdit(panel.id, o);
  snap();
  st.added.push(newJob(o));
  save();
  closePanel();
  st.view = 'jobs';
  render();
  toast(`Job ${o.job} added.`, true);
});

/* jobs.js: every job in a grid. A column heading sorts; the filters and the search box in the top bar narrow. */

let jobSort = { by: '', dir: 1 };
const SORT_VALUE = {
  job: (j) => jobNo(j),
  po: (j) => j.po || '',
  proc: (j) => j.proc,
  process: (j) => j.process,
  qty: (j) => j.qty || 0,
  sent: (j) => j.sent,
  due: (j, s) => s.due,
  status: (j, s) => URGENCY.indexOf(s.k),
  upd: (j) => j.ev[j.ev.length - 1].d,
};
const COLUMNS = [
  ['job', 'Job'],
  ['po', 'PO'],
  ['proc', 'Processor'],
  ['process', 'Process'],
  ['qty', 'Qty', 'n'],
  ['sent', 'Sent'],
  ['due', 'Due back'],
  ['status', 'Status'],
  ['upd', 'Last update'],
];

function columnHeading([key, label, cls]) {
  const sorted = jobSort.by === key;
  const direction = jobSort.dir > 0 ? 'ascending' : 'descending';
  return html`<th class="${cls}" aria-sort="${sorted ? direction : 'none'}">
    <button type="button" class="sort" data-sort="${key}">${label}${sorted && (jobSort.dir > 0 ? ' ▲' : ' ▼')}</button>
  </th>`;
}

function jobRow([j, s]) {
  const latest = j.ev[j.ev.length - 1];
  const overdue = isOpen(j) && s.due < T;
  return html`<tr class="click" data-job="${j.id}">
    <td><span class="job">${jobNo(j)}</span></td>
    <td>${j.po}</td>
    <td>${j.proc}</td>
    <td>${j.process}</td>
    <td class="n">${j.qty || ''}</td>
    <td>${fmtDate(j.sent)}</td>
    <td class="${overdue ? 'bad' : ''}">${fmtDate(s.due)}</td>
    <td>
      ${chip(s.k)} ${j.exp && html`<span class="chip t-gray" title="An expedite was paid on this job">Expedite</span>`}
    </td>
    <td class="small">
      ${latest.m === 'ask' ? `Asked: ${latest.what || ''}` : STEP_LABEL[latest.m]}, ${fmtDate(latest.d)}
    </td>
  </tr>`;
}

function filterSelect(key, values, placeholder, label = (v) => v) {
  return html`<select data-filter="${key}" aria-label="${placeholder}">
    <option value="">${placeholder}</option>
    ${values.map((v) => html`<option value="${v}" ${v === jobFilter[key] && 'selected'}>${label(v)}</option>`)}
  </select>`;
}

function vJobs(J) {
  const f = jobFilter;
  const pool = J.filter((j) => isOpen(j) !== f.closed).map((j) => [j, statusOf(j, T)]);
  const statuses = URGENCY.filter((k) => pool.some(([, s]) => s.k === k));
  /* A status picked earlier can drop out of the list, for instance when its last job comes back. */
  if (!statuses.includes(f.status)) f.status = '';
  const needle = f.q.trim().toLowerCase();
  const list = pool.filter(
    ([j, s]) =>
      (!f.proc || j.proc === f.proc) &&
      (!f.process || j.process === f.process) &&
      (!f.status || s.k === f.status) &&
      (!needle || `${jobNo(j)} ${j.po} ${j.proc}`.toLowerCase().includes(needle)),
  );
  if (jobSort.by) {
    const value = SORT_VALUE[jobSort.by];
    const compare = (a, b) =>
      typeof a === 'number' ? a - b : String(a).localeCompare(String(b), undefined, { numeric: true });
    list.sort((a, b) => compare(value(...a), value(...b)) * jobSort.dir);
  } else if (f.closed) list.sort(([a], [b]) => (a.sent < b.sent ? 1 : -1));
  else list.sort(byUrgency);

  const unique = (key) => [...new Set(J.map((j) => j[key]))].sort();
  return html`${pageHead(
      'Jobs at processors',
      `${plural(J.filter(isOpen).length, 'open job')} out for outside processing. Click a column heading to sort, or a job for its timeline.`,
      html`<button type="button" class="btn pri" data-addjob>Add a job</button>`,
    )}
    <div class="card">
      <div class="filters">
        ${filterSelect('proc', unique('proc'), 'All processors')}
        ${filterSelect('process', unique('process'), 'All processes')}
        ${filterSelect('status', statuses, 'Any status', (k) => STATUS[k][0])}
        <label class="small"><input type="checkbox" data-filter="closed" ${f.closed && 'checked'} /> Show closed</label>
      </div>
      ${list.length
        ? html`<table class="grid">
            <thead>
              <tr>
                ${COLUMNS.map(columnHeading)}
              </tr>
            </thead>
            <tbody>
              ${list.map(jobRow)}
            </tbody>
          </table>`
        : html`<div class="empty">
            ${J.length ? 'No jobs match these filters.' : 'No jobs yet. Add one, or import your list.'}
          </div>`}
    </div>`;
}

on('click', '[data-sort]', (el) => {
  const by = el.dataset.sort;
  jobSort = { by, dir: jobSort.by === by ? -jobSort.dir : 1 };
  render();
  $(`[data-sort="${by}"]`).focus({ preventScroll: true });
});

on('input', '[data-filter]', (el) => {
  const key = el.dataset.filter;
  jobFilter[key] = el.type === 'checkbox' ? el.checked : el.value;
  render();
  /* The redraw replaced the control being used, so focus goes back to its replacement. */
  const again = $(`[data-filter="${key}"]`);
  again.focus({ preventScroll: true });
});

/* The search box in the top bar finds a job from any screen by showing it on this one. */
on('input', '#gsearch', (el) => {
  jobFilter.q = el.value;
  st.view = 'jobs';
  render();
});

/* expedites.js: every expedite fee, the date it bought, and whether that date was met. */

function resultChip(x) {
  if (x.res === 'met') return html`<span class="chip t-green">Met</span>`;
  if (x.res === 'open') return html`<span class="chip t-amber">Open · at risk</span>`;
  return html`<span class="chip t-red">Missed by ${plural(x.days, 'day')}</span>`;
}

function creditCell(x) {
  if (x.res !== 'missed') return DASH;
  const state = st.credit[x.id];
  if (state === 'credited') return html`<span class="ok">Credited</span>`;
  /* While the parts are still out, the conversation is about getting them back, not about the fee. */
  if (!x.back) return html`<span class="muted">once it is back</span>`;
  return html`<button type="button" class="btn sm ${state ? '' : 'pri'}" data-credit="${x.id}">
    ${state ? 'Requested · view' : 'Credit request'}
  </button>`;
}

/* processors.js: what each processor actually takes against what it quotes, and a scorecard for a supplier

function trendNote(p) {
  if (p.n < 5) return html`<span class="muted small">needs 5+ jobs</span>`;
  if (p.trend >= 2) return html`<span class="bad">Slower by ~${p.trend} d</span>`;
  if (p.trend <= -2) return html`<span class="ok">Faster by ~${-p.trend} d</span>`;
  return html`<span class="muted">Steady</span>`;
}

function scorecard(J) {
  const rows = scorecards(J, T).filter((p) => p.n);
  if (!rows.length) return '';
  return html`<div class="card score">
    <h2>
      Scorecard
      <span>· every job received back${MODE === 'demo' && ', six months'} · for your own supplier review</span>

    <table>

          <th class="n">Late</th>

          <th class="n">Rework</th>
          <th class="n">Rejected</th>
          <th class="n">Expedites missed</th>

function processorRows(name, processes) {
  const back = processes.reduce((a, p) => a + p.n, 0);

  const out = processes.reduce((a, p) => a + p.open, 0);
  return html`<tr class="grp">
      <td colspan="7">
        ${name}
        <span class="small">
          · ${plural(back, 'job')} back${MODE === 'demo' && ' in 6 months'} · ${Math.round(onTime * 100)}% on time ·
          ${out} open now
        </span>
      </td>
    </tr>
    ${processes.map(
      (p) =>
        html`<tr>
          <td class="indent">${p.process}</td>
          <td class="n">${p.q} d</td>
          <td class="n"><b>${p.med} d</b></td>
          <td class="small turns">
            ${p.last5.map((days) => html`<span class="${days > p.q ? 'bad' : ''}">${days}</span>`)}
          </td>
          <td>${trendNote(p)}</td>
          <td class="n">${Math.round(p.ontime * 100)}%</td>
          <td class="n">
            ${p.n >= 4
              ? html`<span class="chip t-blue quote">${p.p80} days</span>`
              : html`<span class="muted small">needs 4+ jobs</span>`}

        </tr>`,
    )}`;
}

/* import.js: bringing in the shop's own list, from a file, a drag, or pasted rows.

   Two steps. First the text or file becomes rows. Then the person confirms which column is which, sees what
   loading it would do (planImport), and only then is anything changed. */

const NEEDED_FIELDS = ['job', 'proc', 'sent', 'due'];
const requiredFirst = ([a], [b]) => NEEDED_FIELDS.includes(b) - NEEDED_FIELDS.includes(a);
const SAMPLE_SHEET = [
  'Job,Vendor,Op,Qty,Shipped out,Ship via,Tracking #,Promised back,Expedite $,Expedite by',
  '2626,Anodize House A,"Anodize, Type II",36,11/23/2026,Shop driver,,11/30/2026,,',
  '2627,Plating House C,Electroless nickel,12,11/23/2026,FedEx Ground,DEMO-FDX-8812,12/3/2026,,',
  '2628,Heat Treat House D,Vacuum heat treat,40,11/23/2026,Shop driver,,11/30/2026,250,11/27/2026',
  '2629,NDT Lab F,Penetrant inspection,18,11/23/2026,Shop driver,,11/27/2026,,',
  '2630,Grinding House G,Centerless grind,75,11/23/2026,UPS Ground,DEMO-UPS-6620,11/30/2026,,',
].join('\n');

/* pendingImport is { text } while pasting, and gains { rows, map, name } once there are rows to match. */
function startMatching(rows, text, name) {
  pendingImport = { text, rows, map: guessColumns(rows[0]), name };
  st.view = 'imp';
  render();
}

async function loadFile(file) {
  if (/\.xls$/i.test(file.name))
    return toast('Old .xls files are not supported. In Excel: Save As, Excel Workbook (.xlsx) or CSV.');
  let rows;
  try {
    rows = /\.xlsx$/i.test(file.name) ? await readXlsx(await file.arrayBuffer()) : parseTable(await file.text());
  } catch {
    return toast('That file could not be read. Save it as CSV and try again.');
  }
  if (rows.length < 2) return toast('That file has no rows to read.');
  startMatching(rows, '', file.name);
  toast(`${file.name}: ${rows.length - 1} rows. Check the columns.`);
}

/* ---------- the screen ---------- */

function pasteStep() {

      One row per job sent out. Required: job number, processor, date sent, due back. Helpful: process, qty, PO, carrier
      and tracking, expedite fee and date. Past jobs with a <b>date received back</b> give you real turn times from day
      one. Leave part numbers, drawings and customer names out; they are not used.
    </p>
    <div class="card">
      <div class="pad">
        <div class="row first">
          <label class="btn pri" tabindex="0" role="button" data-picks="ifile">
            Choose an Excel or CSV file

          </label>
          <span class="small">or drag it anywhere onto this page. Nothing leaves this page.</span>
        </div>
        <p><label for="csv">Or paste rows copied from Excel. The first row is the column names.</label></p>
        <textarea id="csv" rows="5">${pendingImport ? pendingImport.text : ''}</textarea>

function planSummary(plan) {
  if (!plan) return 'Match the four required columns to see what this sheet will do.';
  return (
    [
      plural(plan.add.length, 'new job'),
      plan.close.length && `${plural(plan.close.length, 'job')} on file now shown as back`,
      plan.move.length && `${plural(plan.move.length, 'due date')} changed in the sheet`,
      plan.same && `${plan.same} already on file, unchanged`,
      plan.skip && `${plural(plan.skip, 'row')} skipped (missing or impossible date)`,
    ]
      .filter(Boolean)
      .join(' · ') + '.'
  );
}

function importButtonLabel(plan) {
  if (!plan) return 'Add jobs';
  const updates = plan.close.length + plan.move.length;
  if (plan.add.length && updates) return `Add ${plan.add.length} and update ${updates}`;
  if (plan.add.length) return `Add ${plural(plan.add.length, 'job')}`;
  if (updates) return `Update ${plural(updates, 'job')}`;
  return 'Nothing new';
}

function matchStep() {
  const { rows, map, name } = pendingImport;
  const [header, ...body] = rows;
  const plan = NEEDED_FIELDS.every((f) => map[f] != null) ? planImport(rows, map, jobs(), T) : null;
  const mapped = new Set(Object.values(map));
  const unread = header.filter((title, i) => !mapped.has(i) && String(title).trim());

  const cell = (row, field) => (map[field] == null ? DASH : row[map[field]] || '');
  const dateCell = (row, field) => {
    if (map[field] == null) return DASH;
    const value = row[map[field]] || '';
    const date = parseDate(value);
    if (date) return `${fmtDate(date)}, ${date.slice(0, 4)}`;
    return value && html`<span class="bad" title="Not read as a date">${value}</span>`;
  };

  return html`<div class="grid2">
    <div class="card">
      <h2>Your columns <span>· a first guess; fix any that are wrong</span></h2>
      <table>
        <tbody>
          ${[...FIELDS].sort(requiredFirst).map(
            ([field, label]) =>
              html`<tr>
                <td>
                  <label for="map-${field}">${label}</label>
                  ${NEEDED_FIELDS.includes(field) && html`<span class="small">(required)</span>`}
                </td>
                <td>
                  <select data-map="${field}" id="map-${field}">
                    <option value="">— not in my sheet —</option>
                    ${header.map(
                      (title, i) => html`<option value="${i}" ${map[field] === i && 'selected'}>${title}</option>`,
                    )}
                  </select>
                </td>
              </tr>`,
          )}
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>Preview <span>· ${body.length} rows${name && ` from ${name}`}</span></h2>
      <table>
        <thead>
          <tr>
            <th>Job</th>
            <th>Processor</th>
            <th>Sent</th>
            <th>Due back</th>
          </tr>
        </thead>
        <tbody>
          ${body.slice(0, 6).map(
            (row) =>
              html`<tr>
                <td>${cell(row, 'job')}</td>
                <td>${cell(row, 'proc')}</td>
                <td>${dateCell(row, 'sent')}</td>
                <td>${dateCell(row, 'due')}</td>
              </tr>`,
          )}
        </tbody>
      </table>
      <div class="pad">
        <p class="small">${planSummary(plan)}</p>
        ${unread.length > 0 && html`<p class="small"><b>Not read, not stored:</b> ${unread.join(', ')}.</p>`}
        <div class="row">
          <button type="button" class="btn pri" id="igo">${importButtonLabel(plan)}</button>
          <button type="button" class="btn" id="iback">Back</button>
        </div>
      </div>
    </div>
  </div>`;
}

function vImport() {
  const matching = !!(pendingImport && pendingImport.rows);
  return html`${pageHead(
      'Import',
      'Start from the spreadsheet you already keep for outside processing, or a file exported from your ERP. Load a fresh export any time: jobs already on file are updated, not doubled.',
    )}
    <div class="steps">
      <span class="${matching ? '' : 'on'}">1 · Paste or choose a file</span>
      <span class="${matching ? 'on' : ''}">2 · Match your columns</span>
      <span>3 · Jobs appear on Today</span>
    </div>
    ${matching ? matchStep() : pasteStep()}`;
}

/* ---------- applying it ---------- */

function applyImport() {
  const { rows, map } = pendingImport;
  const missing = NEEDED_FIELDS.filter((f) => map[f] == null);
  if (missing.length)
    return toast(`Match these first: ${missing.map((f) => FIELDS.find(([key]) => key === f)[1]).join(', ')}`);

  const plan = planImport(rows, map, jobs(), T);
  const updates = plan.close.length + plan.move.length;
  if (!plan.add.length && !updates)
    return toast(
      plan.skip
        ? `Nothing new in this sheet: ${plural(plan.skip, 'row')} skipped (missing or impossible date).`
        : 'Nothing new in this sheet: every job is already on file.',
    );

  snap();
  const added = plan.add.map(newJob);
  st.added.push(...added);
  for (const { id, back } of plan.close) (st.ev[id] = st.ev[id] || []).push({ m: 'back', d: back });
  for (const { id, to } of plan.move) (st.ev[id] = st.ev[id] || []).push({ m: 'newdate', d: T, t: now(), to });
  st.lastImport = `${T} ${now()}`;
  save();

  const history = added.filter((j) => !j.open).length;
  const alreadyOut = added.filter((j) => j.pre).length;
  pendingImport = null;
  jobFilter = newJobFilter();
  /* A sheet of nothing but past jobs goes to the turn times it just filled in. */
  st.view = added.length > history || updates ? 'today' : 'procs';
  render();
  toast(
    [
      added.length &&
        `${plural(added.length, 'job')} added${history ? ` (${history} already back, now in the turn-time history)` : ''}`,
      plan.close.length && `${plan.close.length} marked received back`,
      plan.move.length && `${plural(plan.move.length, 'due date')} changed`,
      plan.skip && `${plan.skip} skipped (missing or impossible date)`,
      alreadyOut && `${alreadyOut} were already out, so they are picked up at the midpoint, not asked about receipt`,
    ]
      .filter(Boolean)
      .join(', ') + '.',
    true,
  );
}

/* ---------- drag a file onto the page ---------- */

const carriesFiles = (e) => !!e.dataTransfer && [...e.dataTransfer.types].includes('Files');
let dragDepth = 0;
document.addEventListener('dragenter', (e) => {
  if (!carriesFiles(e)) return;
  dragDepth++;
  document.body.classList.add('drag');
});
document.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) document.body.classList.remove('drag');
});
document.addEventListener('dragover', (e) => {
  if (carriesFiles(e)) e.preventDefault();
});
document.addEventListener('drop', (e) => {
  if (!carriesFiles(e) || !e.dataTransfer.files.length) return;
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('drag');
  loadFile(e.dataTransfer.files[0]);
});

/* share.js: several people on one list, with no server.

   The jobs live in one JSON file on a drive the office already shares. Each browser holds a handle to that
   file (File System Access API, Chrome and Edge), reads it every 15 seconds and when the window regains
   focus, merges what it finds with its own copy (mergeState in calc.js), and writes the result back when it
   has something the file lacks.

   Every write stamps the file with a new revision id. A browser that sees the id it wrote last knows the
   file has not changed and skips the merge. Two browsers writing in the same instant can still overwrite
   each other; because each keeps its own copy and merges again on the next read, nothing is lost, it only
   takes one more round to settle. */

const CAN_SHARE = typeof window.showSaveFilePicker === 'function';
const SYNC_EVERY_MS = 15000;
const FILE_TYPES = [{ description: 'OSP Watch shared file', accept: { 'application/json': ['.json'] } }];

const sharedFile = { handle: null, rev: null, busy: false, dirty: false, ok: false, note: '' };

/* The file handle is kept in IndexedDB, the one place a browser can store it, so the connection survives a
   restart. Nothing else is kept there. */
function handleStore(mode, run) {
  return new Promise((resolve, reject) => {
    const opening = indexedDB.open('osp-watch', 1);
    opening.onupgradeneeded = () => opening.result.createObjectStore('kv');
    opening.onerror = () => reject(opening.error);
    opening.onsuccess = () => {
      const tx = opening.result.transaction('kv', mode);
      const request = run(tx.objectStore('kv'));
      tx.oncomplete = () => resolve(request.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}

/* What goes into the file: everything except what belongs to one person's screen. */
function shareable(state) {
  const { view, handled, handledOn, ...rest } = state;
  return rest;
}

async function readSharedFile() {
  const text = await (await sharedFile.handle.getFile()).text();
  if (!text.trim()) return null;
  let file;
  try {
    file = JSON.parse(text);
  } catch {
    throw new Error('The shared file could not be read. Restore it from a backup.');
  }
  if (!file || file.app !== 'osp-watch' || !file.state) throw new Error('That file is not an OSP Watch file.');
  return file;
}

async function writeSharedFile() {
  const rev = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  const file = { app: 'osp-watch', v: 1, rev, saved: `${localToday()} ${now()}`, by: st.signer, state: shareable(st) };
  /* Cleared before the write, not after: a change made while the write is in flight sets it again. */
  sharedFile.dirty = false;
  try {
    const writer = await sharedFile.handle.createWritable();
    await writer.write(JSON.stringify(file));
    await writer.close();
    sharedFile.rev = rev;
  } catch (e) {
    sharedFile.dirty = true;
    throw e;
  }
}

async function syncSharedFile() {
  if (!sharedFile.handle || sharedFile.busy || MODE !== 'live') return;
  sharedFile.busy = true;
  let merged = false;
  try {
    const permission = await sharedFile.handle.queryPermission({ mode: 'readwrite' });
    if (permission !== 'granted') {
      sharedFile.ok = false;
      sharedFile.note = 'Click "Reconnect" to keep saving to the shared file.';
      return;
    }
    const file = await readSharedFile();
    /* The person may have switched to the demo while the file was being read. */
    if (MODE !== 'live') return;
    if (file && file.rev !== sharedFile.rev) {
      const theirs = shareable(cleanState(file.state));
      st = {
        ...cleanState(mergeState(shareable(st), theirs)),
        view: st.view,
        handled: st.handled,
        handledOn: st.handledOn,
      };
      store.set(STATE_KEY.live, JSON.stringify(st));
      merged = true;
      sharedFile.rev = file.rev;
      if (JSON.stringify(shareable(st)) !== JSON.stringify(theirs)) sharedFile.dirty = true;
    }
    if (sharedFile.dirty || !file) await writeSharedFile();
    sharedFile.ok = true;
    sharedFile.note = `Saved to ${sharedFile.handle.name} at ${fmtTime(now())}.`;
  } catch (e) {
    sharedFile.ok = false;
    sharedFile.note = e.message || String(e);
  } finally {
    sharedFile.busy = false;
    if (merged || st.view === 'set') render();
    else showFileStatus();
  }
}

let syncTimer = null;
function queueFileSync() {
  if (!sharedFile.handle) return;
  sharedFile.dirty = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncSharedFile, 400);
}

function showFileStatus() {
  const { handle, ok } = sharedFile;
  $('#tb_filec').hidden = MODE !== 'live' || !handle;
  $('#tb_filec').classList.toggle('alarm', !!handle && !ok);
  $('#tb_file').textContent = !handle ? '' : ok ? handle.name : 'reconnect needed';
}

async function connectSharedFile(create) {
  const suggestedName = `osp-watch-${(st.shop || 'shop').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.json`;
  try {
    sharedFile.handle = create
      ? await window.showSaveFilePicker({ suggestedName, types: FILE_TYPES })
      : (await window.showOpenFilePicker({ types: FILE_TYPES }))[0];
  } catch (e) {
    /* Closing the picker is not an error. */
    if (e.name !== 'AbortError') toast(e.message);
    return;
  }
  sharedFile.rev = null;
  sharedFile.dirty = create;
  await syncSharedFile();
  if (!sharedFile.ok) {
    toast(sharedFile.note);
    sharedFile.handle = null;
    return render();
  }
  await handleStore('readwrite', (kv) => kv.put(sharedFile.handle, 'file')).catch(() => {});
  toast('Connected. Everyone who opens this file sees the same jobs.');
}

async function reconnectSharedFile() {
  const permission = await sharedFile.handle.requestPermission({ mode: 'readwrite' });
  if (permission !== 'granted') return;
  await syncSharedFile();
  toast('Shared file reconnected.');
}

async function disconnectSharedFile() {
  Object.assign(sharedFile, { handle: null, rev: null, dirty: false, ok: false, note: '' });
  await handleStore('readwrite', (kv) => kv.delete('file')).catch(() => {});
}

function startSharing() {
  if (!CAN_SHARE) return;
  handleStore('readonly', (kv) => kv.get('file'))
    .then((handle) => {
      if (!handle) return;
      sharedFile.handle = handle;
      return syncSharedFile();
    })
    .catch(() => {});
  setInterval(syncSharedFile, SYNC_EVERY_MS);
  addEventListener('focus', syncSharedFile);
}

on('click', '#fnew', () => connectSharedFile(true));
on('click', '#fopen', () => connectSharedFile(false));
on('click', '#frec, #tb_filec.alarm', reconnectSharedFile);
on('click', '#fdrop', async () => {
  await disconnectSharedFile();
  render();
  toast('Disconnected. This computer keeps its own copy.');
});

function download(name, text, type) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([text], { type }));

  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 2000);
}

function downloadBackup() {
  const file = { app: 'osp-watch', v: 1, saved: T, state: st };
  download(`osp-watch-backup-${T}.json`, JSON.stringify(file), 'application/json');

function exportJobs() {

    'Processor',
    'Process',

    'Delivered',
    'Processor confirmed',
    'Received back',

    'Expedite by',
    'Expedite result',
  ];
  const dateOf = (event) => (event ? event.d : '');
  const rows = jobs().map((j) => {
    const s = statusOf(j, T);

    return [
      jobNo(j),
      j.po,
      j.proc,
      j.process,
      j.qty || '',
      j.sent,
      j.carrier,
      j.trk,

/* ---------- files in ---------- */

async function restoreBackup(file) {
  let backup;
  try {
    backup = JSON.parse(await file.text());
  } catch {
    backup = null;
  }
  if (!backup || backup.app !== 'osp-watch' || !backup.state) return toast('That file is not an OSP Watch backup.');
  const restored = cleanState(backup.state);
  const replacing = st.added.length;
  if (
    replacing &&
    !confirm(
      `Replace the ${plural(replacing, 'job')} on this computer with the ${restored.added.length} in the backup?`,
    )
  )
    return;
  snap();
  st = { ...restored, view: 'today', handled: emptyMap(), handledOn: T };
  save();
  render();
  toast(`Backup restored: ${plural(st.added.length, 'job')}.`, true);
}

/* tour.js: a guided walk through the demo. Each stop shows one screen and points at one thing on it. */

const TOUR_SEEN_KEY = 'osp-watch-tour-v1';
const TOUR = [
  {
    view: 'today',
    target: '#view .tiles',
    title: 'Start here each morning',
    text: 'These are the open jobs that need a word with a processor today, counted by reason. Jobs that are on track stay off this list.',
  },
  {
    view: 'today',
    target: '#view tr.click[data-job]',
    title: 'Each job says why it is here',
    text: 'Delivered but nobody confirmed receipt. Halfway through the turn. Due in two days with no ship notice. Select one and it opens beside the list, like a message.',
  },
  {
    view: 'today',
    target: '#panel',
    before: () => openDraft($('#view .msgs tr[data-job]').dataset.job),
    title: 'The email is already written',
    text: 'It asks for a physical step, such as "is it racked?", not "are we on track?". Edit it, then open it in your own mailbox. Nothing is sent from this page. When they answer, paste the reply here and the step is picked out for you.',
  },
  {
    view: 'jobs',
    target: '#view table',
    title: 'Everything that is out',
    text: 'Every open job at every processor, one line each, like a spreadsheet. Click a column heading to sort, filter by processor or status, or search a job number.',
  },
  {
    view: 'exp',
    target: '#view .tiles',
    title: 'What the rush fees bought',
    text: 'Every expedite fee, the date it paid for, and whether that date was met. Once a missed one is back, a credit request is ready to send.',
  },
  {
    view: 'procs',
    target: '#view .turn-times',
    title: 'Real turn times for your next quote',
    text: 'What each processor quotes against what they actually took, built from jobs marked received back. The blue figure is the lead time to quote with.',
  },
  {
    view: 'imp',
    target: '#view .card',
    title: 'Getting your jobs in',
    text: 'Paste rows from Excel, or drag in a spreadsheet or an ERP export. It needs four columns: job, processor, date sent, due back. Part numbers and customer names are not read or stored.',
  },
  {
    view: 'sum',
    target: '#view .card',
    title: 'The month in your own numbers',
    text: 'What was caught early, what expedites cost, and what was missed. Print it for the monthly meeting.',
  },
  {
    view: 'today',
    target: '#bswitch',
    title: 'Try it on your own jobs',
    text: "This switches to empty screens on today's date. Your jobs stay in this browser, or in one file on your shared drive if the office wants to share them. Come back to this demo any time.",
  },
];

/* The stop being shown, or -1, and the mode to return to when the tour ends. */
let tourStop = -1;
let modeBeforeTour = null;

/* Cut a hole in the dimmed page around the target, and put the caption wherever there is room for it. */
function placeTour() {
  const hole = $('#tourhole');
  const caption = $('#tourpop');
  const target = $(TOUR[tourStop].target);
  const capW = caption.offsetWidth;
  const capH = caption.offsetHeight;
  const within = (value, max) => Math.max(12, Math.min(value, max - 12));
  if (!target) {
    hole.style.cssText = 'left:50%;top:50%;width:0;height:0;border:0';
    caption.style.left = `${(innerWidth - capW) / 2}px`;
    caption.style.top = `${(innerHeight - capH) / 2}px`;
    return;
  }
  const r = target.getBoundingClientRect();
  const left = Math.max(4, r.left - 6);
  const top = Math.max(4, r.top - 6);
  const width = Math.min(innerWidth - 4, r.right + 6) - left;
  const height = Math.min(innerHeight - 4, r.bottom + 6) - top;
  hole.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px`;

  const gap = 12;
  let x = left;
  let y = top + height + gap;
  if (y + capH > innerHeight) {
    if (top - gap - capH >= 0) y = top - gap - capH;
    else if (left - gap - capW >= 0) [x, y] = [left - gap - capW, top + 24];
    else if (left + width + gap + capW <= innerWidth) [x, y] = [left + width + gap, top + 24];
    else [x, y] = [innerWidth, innerHeight];
  }
  caption.style.left = `${within(x, innerWidth - capW)}px`;
  caption.style.top = `${within(y, innerHeight - capH)}px`;
}

/* Bring the target into view. Vertical only: a wide table must not pull the page sideways. */
function scrollToTarget(target) {
  const view = $('#view');
  if (!target || !view.contains(target)) return;
  const r = target.getBoundingClientRect();
  const v = view.getBoundingClientRect();
  const tall = r.height > v.height * 0.55;
  view.scrollTop += r.top - v.top - (tall ? 8 : Math.max(8, (v.height - r.height) / 2));
}

function showStop(index) {
  if (index < 0) return;
  if (index >= TOUR.length) return endTour();
  if (tourStop < 0) {
    modeBeforeTour = MODE;
    if (MODE !== 'demo') setMode('demo');
    document.body.insertAdjacentHTML(
      'beforeend',
      html`<div class="tourblock" id="tourblock"></div>
        <div class="tourhole" id="tourhole"></div>
        <div class="tourpop" id="tourpop" role="dialog" aria-label="Tour"></div>`,
    );
  }
  tourStop = index;
  const stop = TOUR[index];
  const isLast = index === TOUR.length - 1;
  todayFilter = '';
  show(stop.view);
  if (stop.before) stop.before();
  $('#tourpop').innerHTML = html`<div class="tn">Stop ${index + 1} of ${TOUR.length}</div>
    <h3>${stop.title}</h3>
    <p>${stop.text}</p>
    <div class="ta">
      <button type="button" class="skip" data-tour="end">${isLast ? 'Close' : 'Skip the tour'}</button>
      <span class="grow"></span>
      ${index > 0 && html`<button type="button" class="btn sm" data-tour="back">Back</button>`}
      <button type="button" class="btn pri sm" data-tour="next">${isLast ? 'Done' : 'Next'}</button>
    </div>`;
  scrollToTarget($(stop.target));
  placeTour();
  $('#tourpop [data-tour="next"]').focus();
}

function endTour() {
  if (tourStop < 0) return;
  tourStop = -1;
  for (const id of ['#tourblock', '#tourhole', '#tourpop']) $(id).remove();
  store.set(TOUR_SEEN_KEY, '1');
  if (modeBeforeTour !== MODE) setMode(modeBeforeTour);
  else show('today');
}

on('click', '#btour', () => showStop(0));
on('click', '[data-tour]', (el) => {
  if (el.dataset.tour === 'end') endTour();
  else showStop(tourStop + (el.dataset.tour === 'back' ? -1 : 1));
});
addEventListener('resize', () => tourStop >= 0 && placeTour());

/* While the tour is up it owns the keyboard: the capture phase runs before the page's own shortcuts. Tab
   stays inside the caption. */
document.addEventListener(
  'keydown',
  (e) => {
    if (tourStop < 0) return;
    e.stopImmediatePropagation();
    if (e.key === 'Escape') endTour();
    else if (e.key === 'ArrowRight') showStop(tourStop + 1);
    else if (e.key === 'ArrowLeft') showStop(tourStop - 1);
    else if (e.key === 'Tab') {
      const buttons = $$('#tourpop button');
      const edge = e.shiftKey ? buttons[0] : buttons[buttons.length - 1];
      if (document.activeElement === edge) {
        e.preventDefault();
        (e.shiftKey ? buttons[buttons.length - 1] : buttons[0]).focus();
      }
    }
  },
  true,
);

/* The tour starts by itself on a first visit to the demo, on a screen wide enough to hold it. */
function offerTour() {
  if (MODE === 'demo' && innerWidth >= 760 && !store.get(TOUR_SEEN_KEY)) setTimeout(() => showStop(0), 400);
}

/* main.js: the keyboard, the banner buttons, and start-up. Inlined last, once every screen is defined. */

/* Arrow keys (or j and k) move through the rows of a list and Enter opens one, as in a mail program. They
   stand down while typing in a field and while the panel is open as a dialog. */
function listKeys(e) {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.metaKey || e.ctrlKey || e.altKey || typing || (panel && !isDocked())) return;
  const rows = $$('#view tr.click[data-job]');
  if (!rows.length) return;
  const key = e.key.toLowerCase();
  const step = key === 'j' || key === 'arrowdown' ? 1 : key === 'k' || key === 'arrowup' ? -1 : 0;
  const current = rows.findIndex((r) => r.classList.contains('kb') || r.classList.contains('sel'));

  if (step) {
    const next = rows[Math.max(0, Math.min(rows.length - 1, current + step))];
    for (const r of rows) r.classList.toggle('kb', r === next);
    next.scrollIntoView({ block: 'nearest' });
    if (isDocked()) openJob(next.dataset.job);
    e.preventDefault();
  } else if (key === 'enter' && current >= 0 && !document.activeElement.closest('button, a')) {
    const id = rows[current].dataset.job;
    if (statusOf(job(id), T).action) openDraft(id);
    else openJob(id);
    e.preventDefault();
  }
}
document.addEventListener('keydown', listKeys);

on('click', '#reset', () => {
  if (MODE === 'live') return downloadBackup();
  store.remove(STATE_KEY.demo);
  st = blankState();
  undoState = null;
  resetScreens();
  render();
  toast('Demo reset to this morning.');
});

/* A page left open overnight would go on stamping yesterday's date. When the window is looked at again on a
   new day, live mode moves to that day. */
function rollOverToToday() {
  if (MODE !== 'live' || document.hidden || localToday() === T) return;
  T = localToday();
  st.handled = emptyMap();
  st.handledOn = T;
  save();
  render();
}
document.addEventListener('visibilitychange', rollOverToToday);
addEventListener('focus', rollOverToToday);

render();
startSharing();
offerTour();
if (USAGE_ENDPOINT) startUsage();
</script>
